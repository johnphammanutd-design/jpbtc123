/* ---------- Table view (bảng kê mọi thẻ — như Trello Table) ---------- */
const tableSort = { key: 'list', dir: 1 };
function renderTable() {
  const root = $('tableView');
  root.innerHTML = '';
  const listTitle = id => boardData.lists.find(l => l.id === id)?.title || '';
  const rows = boardData.cards.filter(cardMatchesFilter).map(c => ({
    c,
    list: listTitle(c.list_id),
    members: membersOf(c.id).map(m => m.name).join(', '),
    labels: labelsOf(c.id).map(id => labelById(id)).filter(Boolean),
    due: c.due_date || '',
    done: c.due_complete ? 1 : 0,
  }));
  const keyVal = r => ({ title: r.c.title.toLowerCase(), list: r.list, members: r.members,
    due: r.due || '9999', done: r.done }[tableSort.key]);
  rows.sort((a, b) => (keyVal(a) > keyVal(b) ? 1 : keyVal(a) < keyVal(b) ? -1 : 0) * tableSort.dir);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  for (const [key, label] of [['title', 'Thẻ'], ['list', 'Cột'], ['members', 'Thành viên'],
                              ['labels', 'Nhãn'], ['due', 'Hạn'], ['done', '✓']]) {
    const th = document.createElement('th');
    th.textContent = label + (tableSort.key === key ? (tableSort.dir > 0 ? ' ↑' : ' ↓') : '');
    if (tableSort.key === key) th.classList.add('sorted');
    if (key !== 'labels') th.onclick = () => {
      if (tableSort.key === key) tableSort.dir *= -1;
      else { tableSort.key = key; tableSort.dir = 1; }
      renderTable();
    };
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (const r of rows) {
    const trr = document.createElement('tr');
    const tdTitle = document.createElement('td');
    tdTitle.textContent = r.c.title;
    const tdList = document.createElement('td');
    tdList.textContent = r.list;
    const tdMem = document.createElement('td');
    tdMem.textContent = r.members;
    const tdLb = document.createElement('td');
    for (const l of r.labels) {
      const s = document.createElement('span');
      s.className = 'pill';
      s.style.background = l.color;
      s.textContent = l.name || '';
      tdLb.appendChild(s);
    }
    const tdDue = document.createElement('td');
    const badge = dueBadge(r.c);
    if (badge) tdDue.appendChild(badge);
    const tdDone = document.createElement('td');
    tdDone.textContent = r.done ? '✅' : '';
    trr.append(tdTitle, tdList, tdMem, tdLb, tdDue, tdDone);
    trr.onclick = () => openCardDialog(r.c);
    tbody.appendChild(trr);
  }
  table.appendChild(tbody);
  root.appendChild(table);
}

function panelFrame(title, backTo) {
  const panel = $('boardMenu');
  panel.innerHTML = '';
  panel.classList.remove('hidden');
  const h = document.createElement('h3');
  if (backTo) {
    const back = document.createElement('button');
    back.className = 'back';
    back.textContent = '‹';
    back.onclick = () => openBoardMenu(backTo);
    h.appendChild(back);
  }
  h.appendChild(document.createTextNode(title));
  const close = document.createElement('button');
  close.className = 'close';
  close.textContent = '✕';
  close.onclick = () => panel.classList.add('hidden');
  panel.append(close, h);
  return panel;
}

async function openBoardMenu(view) {
  if (view === 'main') {
    const p = panelFrame('Menu board');
    const allCollapsed = boardData.lists.length && boardData.lists.every(l => collapsedSet().has(l.id));
    const items = [
      ['🎨 Đổi phông nền', () => openBoardMenu('background')],
      ['⚡ Automation (khi thẻ vào cột…)', () => openBoardMenu('rules')],
      ['🔌 Tiện ích (Power-ups)', () => openBoardMenu('powerups')],
      [boardData.watchingBoard ? '👁 Đang theo dõi board (bấm để bỏ)' : '👁 Theo dõi board', async () => {
        const r = await api(`/boards/${currentBoardId}/watch`, { method: 'POST' });
        boardData.watchingBoard = r.watching;
        toast(r.watching ? 'Sẽ báo bạn mọi hoạt động trên board này' : 'Đã bỏ theo dõi board');
        openBoardMenu('main');
      }],
      [allCollapsed ? '⇥ Mở rộng tất cả cột' : '⇤ Thu gọn tất cả cột', () => {
        const s = allCollapsed ? [] : boardData.lists.map(l => l.id);
        try { localStorage.setItem('kanban-collapsed-' + currentBoardId, JSON.stringify(s)); } catch {}
        renderBoard();
        openBoardMenu('main');
      }],
      ['⎘ Sao chép board', async () => {
        if (!confirm('Tạo bản sao board này (cột, thẻ, nhãn, checklist — không gồm bình luận/file)?')) return;
        const { id } = await api(`/boards/${currentBoardId}/copy`, { method: 'POST' });
        $('boardMenu').classList.add('hidden');
        openBoard(id);
      }],
      ['⬇ Xuất CSV (mở bằng Excel)', async () => {
        const res = await fetch(`/api/boards/${currentBoardId}/export.csv`, { headers: { Authorization: 'Bearer ' + token } });
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${boardData.board.title}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }],
      ['🗃 Mục lưu trữ', () => openBoardMenu('archive')],
      ['📜 Hoạt động của board', () => openBoardMenu('activity')],
      ['🚪 Đóng board này', async () => {
        if (confirm('Đóng board? (mở lại được từ trang danh sách board)')) {
          await api('/boards/' + currentBoardId, { method: 'PATCH', body: { closed: true } });
          $('boardMenu').classList.add('hidden');
          showBoards();
        }
      }],
    ];
    for (const [label, fn] of items) {
      const b = document.createElement('button');
      b.className = 'item';
      b.textContent = label;
      b.onclick = fn;
      p.appendChild(b);
    }
  }
  if (view === 'background') {
    const p = panelFrame('Phông nền', 'main');
    const grid = document.createElement('div');
    grid.className = 'bg-grid';
    for (const key of BG_KEYS) {
      const b = document.createElement('button');
      b.dataset.bg = key;
      b.style.cssText = getComputedStyle(document.body).getPropertyValue('--bg');
      b.className = boardData.board.background === key ? 'on' : '';
      const probe = document.createElement('div');
      probe.className = 'board-tile';
      probe.dataset.bg = key;
      document.body.appendChild(probe);
      b.style.background = getComputedStyle(probe).backgroundImage;
      probe.remove();
      b.onclick = async () => {
        await api('/boards/' + currentBoardId, { method: 'PATCH', body: { background: key } });
        boardData.board.background = key;
        document.body.dataset.bg = key;
        openBoardMenu('background');
      };
      grid.appendChild(b);
    }
    p.appendChild(grid);
  }
  if (view === 'rules') {
    const p = panelFrame('Automation', 'main');
    const intro = document.createElement('p');
    intro.style.cssText = 'font-size:13px;color:var(--muted)';
    intro.textContent = 'Khi một thẻ được kéo vào cột bên dưới, hệ thống tự thực hiện các hành động đã chọn (kiểu Butler của Trello).';
    p.appendChild(intro);
    for (const rule of boardData.rules) {
      const list = boardData.lists.find(l => l.id === rule.trigger_list_id);
      let actions = {};
      try { actions = JSON.parse(rule.actions); } catch {}
      const parts = [];
      if (actions.due_complete) parts.push('đánh dấu hoàn thành hạn');
      if (actions.check_all) parts.push('tick toàn bộ checklist');
      if (actions.label_id) parts.push(`gắn nhãn "${labelById(actions.label_id)?.name || '■'}"`);
      if (actions.member_id) parts.push(`gán ${users.find(u => u.id === actions.member_id)?.name || '?'}`);
      if (actions.cover) parts.push('đặt ảnh bìa');
      const row = document.createElement('div');
      row.className = 'rule-item';
      const span = document.createElement('span');
      span.textContent = `Vào "${list?.title || '?'}" → ${parts.join(', ') || '(trống)'}`;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = async () => { await api('/rules/' + rule.id, { method: 'DELETE' }); await loadBoard(currentBoardId, true); openBoardMenu('rules'); };
      row.append(span, del);
      p.appendChild(row);
    }
    const form = document.createElement('div');
    form.innerHTML = `
      <label>Khi thẻ vào cột</label>
      <select class="field" id="ruleList"></select>
      <label>Thì thực hiện</label>
      <label style="font-weight:400;color:var(--text)"><input type="checkbox" id="ruleDone" style="width:auto"> Đánh dấu hoàn thành hạn</label>
      <label style="font-weight:400;color:var(--text)"><input type="checkbox" id="ruleCheckAll" style="width:auto"> Tick toàn bộ checklist</label>
      <label>Gắn nhãn</label>
      <select class="field" id="ruleLabel"><option value="">— không —</option></select>
      <label>Gán thành viên</label>
      <select class="field" id="ruleMember"><option value="">— không —</option></select>
    `;
    p.appendChild(form);
    for (const l of boardData.lists) {
      const o = document.createElement('option');
      o.value = l.id;
      o.textContent = l.title;
      form.querySelector('#ruleList').appendChild(o);
    }
    for (const l of boardData.labels) {
      const o = document.createElement('option');
      o.value = l.id;
      o.textContent = l.name || '■ (không tên)';
      form.querySelector('#ruleLabel').appendChild(o);
    }
    for (const u of users.filter(u => !u.disabled)) {
      const o = document.createElement('option');
      o.value = u.id;
      o.textContent = u.name;
      form.querySelector('#ruleMember').appendChild(o);
    }
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-primary';
    addBtn.style.marginTop = '10px';
    addBtn.textContent = 'Thêm rule';
    addBtn.onclick = async () => {
      const actions = {};
      if (form.querySelector('#ruleDone').checked) actions.due_complete = true;
      if (form.querySelector('#ruleCheckAll').checked) actions.check_all = true;
      if (form.querySelector('#ruleLabel').value) actions.label_id = Number(form.querySelector('#ruleLabel').value);
      if (form.querySelector('#ruleMember').value) actions.member_id = Number(form.querySelector('#ruleMember').value);
      if (!Object.keys(actions).length) { toast('Chọn ít nhất một hành động'); return; }
      await api(`/boards/${currentBoardId}/rules`, { method: 'POST', body: { trigger_list_id: Number(form.querySelector('#ruleList').value), actions } });
      await loadBoard(currentBoardId, true);
      openBoardMenu('rules');
    };
    p.appendChild(addBtn);

    renderExtraAutomations(p);
  }
  if (view === 'powerups') {
    const p = panelFrame('Tiện ích (Power-ups)', 'main');
    const intro = document.createElement('p');
    intro.style.cssText = 'font-size:13px;color:var(--muted)';
    intro.textContent = 'Bật thêm tiện ích cho riêng board này — như Power-Ups của Trello.';
    p.appendChild(intro);
    const pu = powerups();
    const defs = [
      ['vote', '👍 Vote trên thẻ', 'Mọi người bình chọn ý tưởng — hợp cột Ý tưởng'],
      ['wip', '🚦 Giới hạn WIP mỗi cột', 'Bấm vào số đếm trên cột để đặt giới hạn; vượt là đỏ'],
      ['ai', '✨ Trợ lý AI trong thẻ', aiEnabled ? 'Tóm tắt thẻ, viết mô tả, gợi ý checklist' : 'Máy chủ chưa cấu hình ANTHROPIC_API_KEY — bật sẽ chưa có tác dụng'],
    ];
    for (const [key, label, desc] of defs) {
      const row = document.createElement('label');
      row.style.cssText = 'font-weight:400;color:var(--text);display:block;padding:8px;border-radius:8px;background:var(--bg);margin-bottom:8px;cursor:pointer';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.style.width = 'auto';
      cb.checked = !!pu[key];
      cb.onchange = async () => {
        const next = { ...powerups(), [key]: cb.checked };
        await api('/boards/' + currentBoardId, { method: 'PATCH', body: { powerups: next } });
        boardData.board.powerups = JSON.stringify(next);
        render();
      };
      row.append(cb, document.createTextNode(' ' + label));
      const d = document.createElement('div');
      d.style.cssText = 'font-size:12px;color:var(--muted);margin-left:22px';
      d.textContent = desc;
      row.appendChild(d);
      p.appendChild(row);
    }
  }
  if (view === 'archive') {
    const p = panelFrame('Mục lưu trữ', 'main');
    const { cards, lists } = await api(`/boards/${currentBoardId}/archived`);
    if (!cards.length && !lists.length) {
      const empty = document.createElement('p');
      empty.style.cssText = 'color:var(--muted);font-size:13px';
      empty.textContent = 'Chưa có gì trong lưu trữ.';
      p.appendChild(empty);
    }
    for (const l of lists) {
      const row = document.createElement('div');
      row.className = 'arch-item';
      const s = document.createElement('span');
      s.textContent = '📋 Cột: ' + l.title;
      const restore = document.createElement('button');
      restore.className = 'btn';
      restore.textContent = 'Khôi phục';
      restore.onclick = async () => {
        await api('/lists/' + l.id, { method: 'PATCH', body: { archived: false } });
        await loadBoard(currentBoardId, true);
        openBoardMenu('archive');
      };
      row.append(s, restore);
      p.appendChild(row);
    }
    for (const c of cards) {
      const row = document.createElement('div');
      row.className = 'arch-item';
      const s = document.createElement('span');
      s.textContent = `${c.title} (${c.list_title})`;
      const restore = document.createElement('button');
      restore.className = 'btn';
      restore.textContent = 'Khôi phục';
      restore.onclick = async () => {
        await api('/cards/' + c.id, { method: 'PATCH', body: { archived: false } });
        await loadBoard(currentBoardId, true);
        openBoardMenu('archive');
      };
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '🗑';
      del.title = 'Xóa vĩnh viễn';
      del.onclick = async () => {
        if (confirm('Xóa vĩnh viễn thẻ này? Không thể hoàn tác.')) {
          await api('/cards/' + c.id, { method: 'DELETE' });
          openBoardMenu('archive');
        }
      };
      row.append(s, restore, del);
      p.appendChild(row);
    }
  }
  if (view === 'activity') {
    const p = panelFrame('Hoạt động', 'main');
    const { activity } = await api(`/boards/${currentBoardId}/activity`);
    for (const a of activity) p.appendChild(activityRow(a));
  }
}

/* Automation mở rộng: theo lịch, theo ngày hạn, nút thẻ (trong panel Automation) */
function renderExtraAutomations(p) {
  const h = t => { const x = document.createElement('h4'); x.style.cssText = 'margin:18px 0 6px;font-size:13px'; x.textContent = t; p.appendChild(x); };
  const rowEl = (text, delPath) => {
    const row = document.createElement('div');
    row.className = 'rule-item';
    const span = document.createElement('span');
    span.textContent = text;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = async () => { await api(delPath, { method: 'DELETE' }); await loadBoard(currentBoardId, true); openBoardMenu('rules'); };
    row.append(span, del);
    p.appendChild(row);
  };
  const listName = id => boardData.lists.find(l => l.id === Number(id))?.title || '?';
  const labelName = id => labelById(Number(id))?.name || '■';
  const DOW_NAMES = ['', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'];
  const SORT_NAMES = { due: 'hạn chót', title: 'tên A→Z', created: 'mới tạo trước' };

  /* --- Theo lịch --- */
  h('⏰ Theo lịch (chạy mỗi sáng)');
  for (const s of boardData.schedules || []) {
    let a = {}; try { a = JSON.parse(s.actions); } catch {}
    const what = a.sort ? `sắp xếp "${listName(a.sort.list_id)}" theo ${SORT_NAMES[a.sort.by] || a.sort.by}`
      : a.archive_done_list_id ? `lưu trữ thẻ ✓ xong trong "${listName(a.archive_done_list_id)}"` : '(trống)';
    rowEl(`${s.cadence === 'daily' ? 'Hằng ngày' : DOW_NAMES[s.weekday] + ' hằng tuần'} → ${what}`, '/schedules/' + s.id);
  }
  const sf = document.createElement('div');
  sf.innerHTML = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select class="field" id="schCad" style="width:auto">
        <option value="daily">Hằng ngày</option><option value="weekly">Hằng tuần vào…</option></select>
      <select class="field hidden" id="schDow" style="width:auto">
        ${['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'].map((d, i) => `<option value="${i + 1}">${d}</option>`).join('')}</select>
      <select class="field" id="schAct" style="width:auto">
        <option value="sort">sắp xếp cột…</option><option value="archive">lưu trữ thẻ ✓ xong trong cột…</option></select>
      <select class="field" id="schList" style="width:auto"></select>
      <select class="field" id="schBy" style="width:auto">
        <option value="due">theo hạn</option><option value="title">theo tên</option><option value="created">mới trước</option></select>
      <button class="btn btn-primary" id="schAdd" style="padding:6px 10px">+</button>
    </div>`;
  p.appendChild(sf);
  for (const l of boardData.lists) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = l.title;
    sf.querySelector('#schList').appendChild(o);
  }
  sf.querySelector('#schCad').onchange = () =>
    sf.querySelector('#schDow').classList.toggle('hidden', sf.querySelector('#schCad').value !== 'weekly');
  sf.querySelector('#schAct').onchange = () =>
    sf.querySelector('#schBy').classList.toggle('hidden', sf.querySelector('#schAct').value !== 'sort');
  sf.querySelector('#schAdd').onclick = async () => {
    const listId = Number(sf.querySelector('#schList').value);
    const actions = sf.querySelector('#schAct').value === 'sort'
      ? { sort: { list_id: listId, by: sf.querySelector('#schBy').value } }
      : { archive_done_list_id: listId };
    await api(`/boards/${currentBoardId}/schedules`, { method: 'POST', body: {
      cadence: sf.querySelector('#schCad').value, weekday: Number(sf.querySelector('#schDow').value), actions } });
    await loadBoard(currentBoardId, true);
    openBoardMenu('rules');
  };

  /* --- Theo ngày hạn --- */
  h('🔴 Theo ngày hạn (quét mỗi giờ, mỗi thẻ áp 1 lần)');
  for (const r of boardData.dueRules || []) {
    let a = {}; try { a = JSON.parse(r.actions); } catch {}
    const parts = [];
    if (a.label_id) parts.push(`gắn nhãn "${labelName(a.label_id)}"`);
    if (a.move_list_id) parts.push(`chuyển sang "${listName(a.move_list_id)}"`);
    rowEl(`${r.trigger === 'overdue' ? 'Khi thẻ QUÁ HẠN' : 'Trước hạn 1 ngày'} → ${parts.join(', ') || '(trống)'}`, '/due-rules/' + r.id);
  }
  const df = document.createElement('div');
  df.innerHTML = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select class="field" id="dueTrig" style="width:auto">
        <option value="overdue">Khi quá hạn</option><option value="due_tomorrow">Trước hạn 1 ngày</option></select>
      <select class="field" id="dueLabel" style="width:auto"><option value="">nhãn: không</option></select>
      <select class="field" id="dueMove" style="width:auto"><option value="">chuyển cột: không</option></select>
      <button class="btn btn-primary" id="dueAdd" style="padding:6px 10px">+</button>
    </div>`;
  p.appendChild(df);
  for (const l of boardData.labels) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = 'nhãn: ' + (l.name || '■');
    df.querySelector('#dueLabel').appendChild(o);
  }
  for (const l of boardData.lists) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = '→ ' + l.title;
    df.querySelector('#dueMove').appendChild(o);
  }
  df.querySelector('#dueAdd').onclick = async () => {
    const actions = {};
    if (df.querySelector('#dueLabel').value) actions.label_id = Number(df.querySelector('#dueLabel').value);
    if (df.querySelector('#dueMove').value) actions.move_list_id = Number(df.querySelector('#dueMove').value);
    if (!Object.keys(actions).length) { toast('Chọn ít nhất một hành động'); return; }
    await api(`/boards/${currentBoardId}/due-rules`, { method: 'POST', body: { trigger: df.querySelector('#dueTrig').value, actions } });
    await loadBoard(currentBoardId, true);
    openBoardMenu('rules');
  };

  /* --- Nút thẻ tùy chỉnh --- */
  h('🔘 Nút thẻ (hiện trong mọi thẻ của board)');
  for (const b of boardData.cardButtons || []) {
    let a = {}; try { a = JSON.parse(b.actions); } catch {}
    const parts = [];
    if (a.move_list_id) parts.push(`chuyển → "${listName(a.move_list_id)}"`);
    if (a.due_shift_days !== undefined && a.due_shift_days !== '') parts.push(`hạn ${a.due_shift_days >= 0 ? '+' : ''}${a.due_shift_days} ngày`);
    if (a.label_id) parts.push(`nhãn "${labelName(a.label_id)}"`);
    if (a.complete) parts.push('đánh dấu ✓');
    rowEl(`"${b.name}" → ${parts.join(', ') || '(trống)'}`, '/buttons/' + b.id);
  }
  const bf = document.createElement('div');
  bf.innerHTML = `
    <input type="text" id="btnName" placeholder="Tên nút (vd: Đẩy sang Duyệt)" style="margin-bottom:6px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select class="field" id="btnMove" style="width:auto"><option value="">chuyển cột: không</option></select>
      <input type="text" id="btnDue" placeholder="hạn ±ngày" style="width:80px">
      <select class="field" id="btnLabel" style="width:auto"><option value="">nhãn: không</option></select>
      <label style="margin:0;font-weight:400;display:flex;gap:4px;align-items:center;font-size:13px">
        <input type="checkbox" id="btnDone" style="width:auto">✓ xong</label>
      <button class="btn btn-primary" id="btnAdd" style="padding:6px 10px">+</button>
    </div>`;
  p.appendChild(bf);
  for (const l of boardData.lists) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = '→ ' + l.title;
    bf.querySelector('#btnMove').appendChild(o);
  }
  for (const l of boardData.labels) {
    const o = document.createElement('option'); o.value = l.id; o.textContent = 'nhãn: ' + (l.name || '■');
    bf.querySelector('#btnLabel').appendChild(o);
  }
  bf.querySelector('#btnAdd').onclick = async () => {
    const name = bf.querySelector('#btnName').value.trim();
    if (!name) { toast('Đặt tên nút trước'); return; }
    const actions = {};
    if (bf.querySelector('#btnMove').value) actions.move_list_id = Number(bf.querySelector('#btnMove').value);
    if (bf.querySelector('#btnDue').value.trim() !== '') actions.due_shift_days = Number(bf.querySelector('#btnDue').value);
    if (bf.querySelector('#btnLabel').value) actions.label_id = Number(bf.querySelector('#btnLabel').value);
    if (bf.querySelector('#btnDone').checked) actions.complete = true;
    if (!Object.keys(actions).length) { toast('Chọn ít nhất một hành động'); return; }
    await api(`/boards/${currentBoardId}/buttons`, { method: 'POST', body: { name, actions } });
    await loadBoard(currentBoardId, true);
    openBoardMenu('rules');
  };
}

function activityText(a) {
  let d = {};
  try { d = JSON.parse(a.data); } catch {}
  const card = a.card_title ? `"${a.card_title}"` : 'thẻ';
  switch (a.type) {
    case 'card_created': return `đã tạo thẻ "${d.title || ''}"`;
    case 'card_moved': return `đã chuyển ${card} từ "${d.from}" sang "${d.to}"`;
    case 'card_archived': return `đã lưu trữ ${card}`;
    case 'card_restored': return `đã khôi phục ${card}`;
    case 'card_copied': return `đã sao chép thẻ "${d.title || ''}"`;
    case 'card_completed': return `đã đánh dấu hoàn thành ${card}`;
    case 'card_uncompleted': return `đã bỏ đánh dấu hoàn thành ${card}`;
    case 'comment_added': return `đã bình luận vào ${card}: “${d.text || ''}”`;
    case 'members_changed': return `đã cập nhật thành viên của ${card}`;
    case 'attachment_added': return `đã đính kèm "${d.name}" vào ${card}`;
    case 'list_archived': return `đã lưu trữ cột "${d.title}"`;
    case 'list_restored': return `đã khôi phục cột "${d.title}"`;
    case 'board_created': return `đã tạo board "${d.title}"`;
    case 'board_closed': return 'đã đóng board';
    case 'board_reopened': return 'đã mở lại board';
    case 'rule_applied': return `⚡ Automation đã chạy trên ${card} (${(d.applied || []).join(', ')})`;
    case 'card_merged': return `⇄ đã hợp nhất thẻ "${d.from}" vào "${d.into}"`;
    default: return a.type;
  }
}

function activityRow(a) {
  const row = document.createElement('div');
  row.className = 'activity-item';
  const who = document.createElement('b');
  who.textContent = a.user_name || 'Hệ thống';
  row.appendChild(who);
  row.appendChild(document.createTextNode(' ' + activityText(a)));
  const when = document.createElement('div');
  when.className = 'when';
  when.textContent = a.created_at + ' UTC';
  row.appendChild(when);
  return row;
}

/* ---------- Tìm kiếm toàn cục ---------- */
let searchTimer = null;
$('searchBox').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('searchBox').value.trim();
  if (q.length < 2) { $('searchResults').classList.add('hidden'); return; }
  searchTimer = setTimeout(async () => {
    const { cards } = await api('/search?q=' + encodeURIComponent(q));
    const box = $('searchResults');
    box.innerHTML = '';
    box.classList.remove('hidden');
    if (!cards.length) {
      const d = document.createElement('div');
      d.style.cssText = 'padding:10px;color:var(--muted);font-size:13px';
      d.textContent = 'Không tìm thấy thẻ nào';
      box.appendChild(d);
    }
    for (const c of cards) {
      const b = document.createElement('button');
      const t = document.createElement('div');
      t.textContent = c.title;
      const w = document.createElement('div');
      w.className = 'where';
      w.textContent = `${c.board_title} › ${c.list_title}`;
      b.append(t, w);
      b.onclick = () => {
        box.classList.add('hidden');
        $('searchBox').value = '';
        pendingOpenCardId = c.id;
        openBoard(c.board_id);
      };
      box.appendChild(b);
    }
  }, 250);
};
document.addEventListener('click', e => {
  if (!e.target.isConnected) return; // phần tử vừa bị re-render tách khỏi DOM — không phải bấm ra ngoài
  if (!$('searchWrap').contains(e.target)) $('searchResults').classList.add('hidden');
  if (!$('filterPop').contains(e.target) && e.target !== $('filterBtn')) $('filterPop').classList.add('hidden');
  if (!$('notifWrap').contains(e.target)) $('notifPop').classList.add('hidden');
});

/* ---------- Chi tiết thẻ ---------- */
let editingCard = null;
let editChecklist = [];
let deletedChecklist = [];

function openCardDialog(c) {
  editingCard = c;
  setHash('#c/' + c.id);
  $('fTitle').value = c.title;
  $('fDesc').value = c.description || '';
  $('fDue').value = c.due_date || '';
  $('fStart').value = c.start_date || '';
  $('fDueTime').value = c.due_time || '';
  $('fRecur').value = c.recur || '';
  $('fRemind').value = c.remind || '1d';
  $('fDueDone').checked = !!c.due_complete;

  // Đợt 2: AI, vote
  $('aiSection').classList.toggle('hidden', !(aiEnabled && powerups().ai));
  $('aiOut').classList.add('hidden');
  $('aiOut').textContent = '';
  $('watchCard').textContent = boardData.myWatches?.includes(c.id) ? '👁 Đang theo dõi' : '👁 Theo dõi';
  $('joinCard').textContent = membersOf(c.id).some(m => m.user_id === me.id) ? '➖ Rời thẻ' : '➕ Tham gia';

  // Nút thẻ tùy chỉnh (Automation → Nút thẻ)
  const fcb = $('fCardButtons');
  fcb.innerHTML = '';
  for (const b of boardData.cardButtons || []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = '🔘 ' + b.name;
    btn.onclick = async () => {
      await api(`/cards/${c.id}/apply-button/${b.id}`, { method: 'POST' });
      toast(`Đã chạy "${b.name}"`);
      $('cardDialog').close();
      editingCard = null;
    };
    fcb.appendChild(btn);
  }
  const voteBtn = $('voteCard');
  voteBtn.classList.toggle('hidden', !powerups().vote);
  const refreshVoteBtn = () => {
    const n = (boardData.voteCounts?.find(x => x.card_id === c.id) || {}).n || 0;
    voteBtn.textContent = (boardData.myVotes?.includes(c.id) ? '👍 Đã vote' : '👍 Vote') + (n ? ` (${n})` : '');
  };
  refreshVoteBtn();

  // Ảnh bìa
  const coverEl = $('fCover');
  coverEl.innerHTML = '';
  const none = document.createElement('button');
  none.type = 'button';
  none.className = 'none' + (c.cover ? '' : ' on');
  none.textContent = 'Không';
  none.onclick = () => { [...coverEl.children].forEach(b => b.classList.remove('on')); none.classList.add('on'); };
  coverEl.appendChild(none);
  for (const color of LABEL_COLORS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.background = color;
    b.dataset.color = color;
    if (c.cover === color) b.classList.add('on');
    b.onclick = () => { [...coverEl.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); };
    coverEl.appendChild(b);
  }
  if (c.cover && c.cover.startsWith('url:')) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'imgcover on';
    b.textContent = '🖼 Ảnh hiện tại';
    b.dataset.color = c.cover;
    b.onclick = () => { [...coverEl.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); };
    coverEl.appendChild(b);
  }

  // Thành viên
  const mEl = $('fMembers');
  mEl.innerHTML = '';
  const current = membersOf(c.id).map(m => m.user_id);
  for (const u of users.filter(u => !u.disabled)) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (current.includes(u.id) ? ' on' : '');
    chip.textContent = u.name;
    chip.dataset.userId = u.id;
    chip.onclick = () => chip.classList.toggle('on');
    mEl.appendChild(chip);
  }

  // Nhãn của board
  renderLabelEditor(c);

  renderChecklistEditor(checklistOf(c.id).map(i => ({ ...i, checked: !!i.checked })));
  deletedChecklist = [];
  $('fComments').innerHTML = '';
  $('fNewComment').value = '';
  $('fAttachments').innerHTML = '';
  $('fNewAttach').value = '';
  $('fActivity').classList.add('hidden');
  $('fActivity').innerHTML = '';
  $('toggleCardActivity').textContent = 'Hiện hoạt động của thẻ';
  loadComments(c.id);
  loadAttachments(c.id);
  $('cardDialog').showModal();
}

function renderLabelEditor(c) {
  const lEl = $('fLabels');
  lEl.innerHTML = '';
  const current = labelsOf(c.id);
  for (const l of boardData.labels) {
    const row = document.createElement('div');
    row.className = 'label-row';
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch' + (current.includes(l.id) ? ' on' : '');
    sw.style.background = l.color;
    sw.textContent = l.name || '';
    sw.dataset.labelId = l.id;
    sw.onclick = () => sw.classList.toggle('on');
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'del';
    edit.textContent = '✎';
    edit.title = 'Đổi tên nhãn';
    edit.onclick = async () => {
      const name = prompt('Tên nhãn:', l.name);
      if (name === null) return;
      await api('/labels/' + l.id, { method: 'PATCH', body: { name } });
      await loadBoard(currentBoardId, true);
      renderLabelEditor(boardData.cards.find(x => x.id === c.id) || c);
    };
    row.append(sw, edit);
    lEl.appendChild(row);
  }
}

$('addLabelBtn').onclick = async () => {
  const name = prompt('Tên nhãn mới:');
  if (name === null) return;
  const color = LABEL_COLORS[boardData.labels.length % LABEL_COLORS.length];
  await api(`/boards/${currentBoardId}/labels`, { method: 'POST', body: { name, color } });
  await loadBoard(currentBoardId, true);
  if (editingCard) renderLabelEditor(editingCard);
};

function renderChecklistEditor(items) {
  editChecklist = items;
  const wrap = $('fChecklist');
  wrap.innerHTML = '';
  for (const item of editChecklist) {
    const row = document.createElement('div');
    row.className = 'checklist-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = item.checked;
    cb.onchange = () => item.checked = cb.checked;
    const txt = document.createElement('input');
    txt.type = 'text';
    txt.value = item.text;
    txt.oninput = () => item.text = txt.value;
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = () => {
      if (item.id) deletedChecklist.push(item.id);
      renderChecklistEditor(editChecklist.filter(i => i !== item));
    };
    row.append(cb, txt, del);
    wrap.appendChild(row);
  }
}
$('addCheck').onclick = () => renderChecklistEditor([...editChecklist, { text: '', checked: false }]);

async function loadComments(cardId) {
  const { comments } = await api(`/cards/${cardId}/comments`);
  if (!editingCard || editingCard.id !== cardId) return;
  const wrap = $('fComments');
  wrap.innerHTML = '';
  for (const cm of comments) {
    const d = document.createElement('div');
    d.className = 'comment';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = `${cm.author || 'Người dùng đã xóa'} · ${cm.created_at} UTC`;
    const txt = document.createElement('div');
    txt.textContent = cm.text;
    d.append(who, txt);
    wrap.appendChild(d);
  }
}

async function loadAttachments(cardId) {
  const { attachments } = await api(`/cards/${cardId}/attachments`);
  if (!editingCard || editingCard.id !== cardId) return;
  const wrap = $('fAttachments');
  wrap.innerHTML = '';
  for (const at of attachments) {
    const row = document.createElement('div');
    row.className = 'attachment-row';
    const a = document.createElement('a');
    a.href = at.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = (at.url.startsWith('/u/') ? '📄 ' : '📎 ') + at.name;
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = async () => { await api('/attachments/' + at.id, { method: 'DELETE' }); loadAttachments(cardId); };
    if (/\.(png|jpe?g|gif|webp)$/i.test(at.url)) {
      const cov = document.createElement('button');
      cov.type = 'button';
      cov.className = 'del';
      cov.textContent = '🖼';
      cov.title = 'Đặt làm ảnh bìa';
      cov.onclick = async () => {
        await api('/cards/' + cardId, { method: 'PATCH', body: { cover: 'url:' + at.url } });
        toast('Đã đặt ảnh bìa');
      };
      row.append(a, cov, del);
    } else row.append(a, del);
    wrap.appendChild(row);
  }
}

$('addAttach').onclick = async () => {
  const url = $('fNewAttach').value.trim();
  if (!url || !editingCard) return;
  await api(`/cards/${editingCard.id}/attachments`, { method: 'POST', body: { url } });
  $('fNewAttach').value = '';
  loadAttachments(editingCard.id);
};

$('sendComment').onclick = async () => {
  const text = $('fNewComment').value.trim();
  if (!text || !editingCard) return;
  await api(`/cards/${editingCard.id}/comments`, { method: 'POST', body: { text } });
  $('fNewComment').value = '';
  loadComments(editingCard.id);
};

$('toggleCardActivity').onclick = async () => {
  const el = $('fActivity');
  if (el.classList.contains('hidden')) {
    const { activity } = await api(`/cards/${editingCard.id}/activity`);
    el.innerHTML = '';
    for (const a of activity) el.appendChild(activityRow(a));
    el.classList.remove('hidden');
    $('toggleCardActivity').textContent = 'Ẩn hoạt động';
  } else {
    el.classList.add('hidden');
    $('toggleCardActivity').textContent = 'Hiện hoạt động của thẻ';
  }
};

$('cardForm').addEventListener('submit', async () => {
  if (!editingCard) return;
  const coverBtn = [...$('fCover').children].find(b => b.classList.contains('on'));
  await api('/cards/' + editingCard.id, { method: 'PATCH', body: {
    title: $('fTitle').value.trim() || editingCard.title,
    description: $('fDesc').value,
    due_date: $('fDue').value,
    start_date: $('fStart').value,
    due_time: $('fDueTime').value,
    recur: $('fRecur').value,
    remind: $('fRemind').value,
    due_complete: $('fDueDone').checked,
    cover: coverBtn?.dataset.color || '',
  }});
  const labelIds = [...document.querySelectorAll('#fLabels .swatch.on')].map(b => Number(b.dataset.labelId));
  await api(`/cards/${editingCard.id}/labels`, { method: 'PUT', body: { label_ids: labelIds } });
  const memberIds = [...document.querySelectorAll('#fMembers .chip.on')].map(b => Number(b.dataset.userId));
  await api(`/cards/${editingCard.id}/members`, { method: 'PUT', body: { user_ids: memberIds } });
  for (const id of deletedChecklist) await api('/checklist/' + id, { method: 'DELETE' });
  for (const item of editChecklist) {
    const text = item.text.trim();
    if (!text) continue;
    if (item.id) await api('/checklist/' + item.id, { method: 'PATCH', body: { text, checked: item.checked } });
    else await api(`/cards/${editingCard.id}/checklist`, { method: 'POST', body: { text } });
  }
  deletedChecklist = [];
  editingCard = null;
});
$('closeCard').onclick = () => { editingCard = null; deletedChecklist = []; $('cardDialog').close(); };
// Đóng dialog bằng bất cứ cách nào (Esc, nút, lưu) → trả hash về board
$('cardDialog').addEventListener('close', () => {
  if (lastHash.startsWith('#c/')) setHash(currentBoardId ? '#b/' + currentBoardId : '');
});

$('linkCard').onclick = async () => {
  if (!editingCard) return;
  const url = location.origin + location.pathname + '#c/' + editingCard.id;
  try { await navigator.clipboard.writeText(url); toast('Đã chép link thẻ — dán vào chat để chia sẻ'); }
  catch { prompt('Chép link thẻ:', url); }
};

$('mergeCard').onclick = () => {
  if (!editingCard) return;
  closeMiniMenu();
  const m = document.createElement('div');
  m.className = 'minimenu';
  m.style.top = '20vh';
  m.style.left = 'calc(50% - 115px)';
  const h = document.createElement('h5');
  h.textContent = 'Hợp nhất vào thẻ nào?';
  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:12px;color:var(--muted);padding:0 4px 6px';
  hint.textContent = 'Checklist, bình luận, đính kèm, nhãn, người… sẽ gộp sang thẻ đích; thẻ này được lưu trữ.';
  m.append(h, hint);
  const sel = document.createElement('select');
  sel.className = 'field';
  for (const l of boardData.lists) {
    for (const c of cardsOf(l.id).filter(x => x.id !== editingCard.id)) {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = `[${l.title}] ${c.title.slice(0, 40)}`;
      sel.appendChild(o);
    }
  }
  const ok = document.createElement('button');
  ok.className = 'btn btn-primary';
  ok.style.marginTop = '8px';
  ok.textContent = 'Hợp nhất';
  ok.onclick = async e => {
    e.stopPropagation();
    if (!sel.value) return;
    await api(`/cards/${editingCard.id}/merge`, { method: 'POST', body: { target_id: Number(sel.value) } });
    closeMiniMenu();
    const target = Number(sel.value);
    editingCard = null;
    $('cardDialog').close();
    toast('Đã hợp nhất thẻ');
    location.hash = '#c/' + target;
    applyHash();
  };
  m.append(sel, ok);
  document.body.appendChild(m);
};

$('joinCard').onclick = async () => {
  if (!editingCard) return;
  const r = await api(`/cards/${editingCard.id}/join`, { method: 'POST' });
  $('joinCard').textContent = r.joined ? '➖ Rời thẻ' : '➕ Tham gia';
  toast(r.joined ? 'Bạn đã tham gia thẻ' : 'Bạn đã rời thẻ');
};

$('watchCard').onclick = async () => {
  if (!editingCard) return;
  const r = await api(`/cards/${editingCard.id}/watch`, { method: 'POST' });
  boardData.myWatches = boardData.myWatches || [];
  if (r.watching) boardData.myWatches.push(editingCard.id);
  else boardData.myWatches = boardData.myWatches.filter(id => id !== editingCard.id);
  $('watchCard').textContent = r.watching ? '👁 Đang theo dõi' : '👁 Theo dõi';
  toast(r.watching ? 'Sẽ báo bạn mọi thay đổi của thẻ này' : 'Đã bỏ theo dõi');
};

$('voteCard').onclick = async () => {
  if (!editingCard) return;
  const r = await api(`/cards/${editingCard.id}/vote`, { method: 'POST' });
  if (r.voted) boardData.myVotes.push(editingCard.id);
  else boardData.myVotes = boardData.myVotes.filter(id => id !== editingCard.id);
  const vc = boardData.voteCounts.find(x => x.card_id === editingCard.id);
  if (vc) vc.n = r.count;
  else boardData.voteCounts.push({ card_id: editingCard.id, n: r.count });
  const n = r.count;
  $('voteCard').textContent = (r.voted ? '👍 Đã vote' : '👍 Vote') + (n ? ` (${n})` : '');
};

/* ---------- Upload file đính kèm ---------- */
$('uploadBtn').onclick = () => $('uploadInput').click();
$('uploadInput').onchange = async () => {
  const file = $('uploadInput').files[0];
  if (!file || !editingCard) return;
  if (file.size > 25 * 1024 * 1024) { toast('File tối đa 25MB'); return; }
  $('uploadBtn').textContent = '⏳ Đang tải…';
  $('uploadBtn').disabled = true;
  try {
    const res = await fetch(`/api/cards/${editingCard.id}/upload?name=${encodeURIComponent(file.name)}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/octet-stream' },
      body: file,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Tải lên thất bại');
    toast('Đã tải file lên');
    loadAttachments(editingCard.id);
  } catch (e) { toast(e.message); }
  $('uploadBtn').textContent = '📤 Tải file';
  $('uploadBtn').disabled = false;
  $('uploadInput').value = '';
};

/* ---------- Trợ lý AI trong thẻ ---------- */
async function runAI(action, apply) {
  if (!editingCard) return;
  const out = $('aiOut');
  out.classList.remove('hidden');
  out.textContent = '✨ Đang nghĩ…';
  try {
    const { text } = await api(`/ai/card/${editingCard.id}`, { method: 'POST', body: { action } });
    apply ? apply(text) : (out.textContent = text);
    if (apply) out.classList.add('hidden');
  } catch (e) { out.textContent = '⚠ ' + e.message; }
}
$('aiSummary').onclick = () => runAI('summary');
$('aiDescribe').onclick = () => runAI('describe', text => { $('fDesc').value = text; toast('Đã điền mô tả — sửa lại rồi bấm Lưu'); });
$('aiChecklist').onclick = () => runAI('checklist', text => {
  const items = text.split('\n').map(s => s.replace(/^[-*\d.\s]+/, '').trim()).filter(Boolean).slice(0, 7);
  renderChecklistEditor([...editChecklist, ...items.map(t => ({ text: t, checked: false }))]);
  toast('Đã thêm gợi ý vào checklist — bấm Lưu để ghi');
});
$('copyCard').onclick = async () => {
  if (!editingCard) return;
  await api(`/cards/${editingCard.id}/copy`, { method: 'POST', body: {} });
  toast('Đã sao chép thẻ');
};
$('archiveCard').onclick = async () => {
  if (!editingCard) return;
  await api('/cards/' + editingCard.id, { method: 'PATCH', body: { archived: true } });
  editingCard = null;
  $('cardDialog').close();
  toast('Đã lưu trữ thẻ (khôi phục trong Menu → Mục lưu trữ)');
};

/* ---------- Đăng nhập / tài khoản ---------- */
$('loginBtn').onclick = async () => {
  $('loginError').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('loginUser').value, password: $('loginPass').value }),
    });
    const data = await res.json();
    if (!res.ok) { $('loginError').textContent = data.error || 'Đăng nhập thất bại'; return; }
    setToken(data.token);
    me = data.user;
    showApp();
  } catch { $('loginError').textContent = 'Không kết nối được máy chủ'; }
};
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').onclick = async () => {
  try { await api('/logout', { method: 'POST' }); } catch {}
  setToken(null);
  me = null;
  if (ws) { ws.onclose = null; ws.close(); }
  showLogin();
};
$('homeLink').onclick = () => { if (me) showBoards(); };

$('pwBtn').onclick = () => { $('pwError').textContent = ''; $('pwCurrent').value = ''; $('pwNew').value = ''; $('pwDialog').showModal(); };
$('pwClose').onclick = () => $('pwDialog').close();
$('pwSave').onclick = async () => {
  try {
    await api('/me/password', { method: 'POST', body: { current: $('pwCurrent').value, password: $('pwNew').value } });
    $('pwDialog').close();
    toast('Đã đổi mật khẩu');
  } catch (e) { $('pwError').textContent = e.message; }
};

/* ---------- Quản lý người dùng ---------- */
$('adminBtn').onclick = async () => { await renderUsers(); $('adminDialog').showModal(); };
$('adminClose').onclick = () => $('adminDialog').close();

async function renderUsers() {
  users = (await api('/users')).users;
  const tbody = $('usersTable');
  tbody.innerHTML = '';
  for (const u of users) {
    const tr = document.createElement('tr');
    const name = document.createElement('td');
    name.textContent = u.name + (u.disabled ? ' (đã khóa)' : '');
    const uname = document.createElement('td');
    uname.textContent = u.username;
    const role = document.createElement('td');
    role.textContent = u.is_admin ? 'Quản trị' : 'Thành viên';
    const act = document.createElement('td');
    if (u.id !== me.id) {
      const reset = document.createElement('button');
      reset.className = 'btn';
      reset.textContent = 'Đặt lại MK';
      reset.onclick = async () => {
        const p = prompt(`Mật khẩu mới cho ${u.name}:`);
        if (p) { await api('/users/' + u.id, { method: 'PATCH', body: { password: p } }); toast('Đã đặt lại mật khẩu'); }
      };
      const lock = document.createElement('button');
      lock.className = 'btn';
      lock.textContent = u.disabled ? 'Mở khóa' : 'Khóa';
      lock.onclick = async () => {
        await api('/users/' + u.id, { method: 'PATCH', body: { disabled: !u.disabled } });
        renderUsers();
      };
      act.append(reset, lock);
    }
    tr.append(name, uname, role, act);
    tbody.appendChild(tr);
  }
}

$('nuCreate').onclick = async () => {
  $('nuError').textContent = '';
  try {
    await api('/users', { method: 'POST', body: {
      username: $('nuUsername').value, name: $('nuName').value,
      password: $('nuPass').value, is_admin: $('nuAdmin').checked,
    }});
    $('nuUsername').value = ''; $('nuName').value = ''; $('nuPass').value = ''; $('nuAdmin').checked = false;
    renderUsers();
    toast('Đã tạo tài khoản');
  } catch (e) { $('nuError').textContent = e.message; }
};

/* ---------- Khởi động ---------- */
(async function init() {
  if (!token) { showLogin(); return; }
  try {
    me = (await api('/me')).user;
    showApp();
  } catch { showLogin(); }
})();
</script>
</body>
</html>
