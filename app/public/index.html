<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng công việc công ty</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --list-bg: #ebecf0;
    --text: #172b4d; --muted: #5e6c84; --accent: #0079bf;
    --danger: #eb5a46; --ok: #61bd4f; --warn: #f2d600;
    --shadow: 0 1px 2px rgba(9,30,66,.25);
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d2125; --surface: #22272b; --list-bg: #161a1d;
      --text: #b6c2cf; --muted: #8c9bab; --accent: #579dff;
      --shadow: 0 1px 2px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body[data-bg] { background-attachment: fixed; }
  body[data-bg="blue"]   { background: linear-gradient(160deg,#0079bf,#5067c5); }
  body[data-bg="ocean"]  { background: linear-gradient(160deg,#00629e,#00b8d9); }
  body[data-bg="sunset"] { background: linear-gradient(160deg,#e8673a,#d04a9b); }
  body[data-bg="forest"] { background: linear-gradient(160deg,#216e4e,#5aac44); }
  body[data-bg="berry"]  { background: linear-gradient(160deg,#6e2b62,#b14bb8); }
  body[data-bg="slate"]  { background: linear-gradient(160deg,#42526e,#6b778c); }
  body[data-bg="sky"]    { background: linear-gradient(160deg,#4b9fe0,#8fd0ef); }
  body[data-bg="rose"]   { background: linear-gradient(160deg,#c9372c,#f87462); }

  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: rgba(0,0,0,.25); color: #fff; backdrop-filter: blur(4px); }
  body:not([data-bg]) header { background: var(--accent); }
  header h1 { font-size: 17px; margin: 0; cursor: pointer; white-space: nowrap; }
  header .spacer { margin-left: auto; }
  header button, header select {
    border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
    background: rgba(255,255,255,.22); color: #fff; font: inherit; }
  header button.on { background: rgba(255,255,255,.45); }
  #searchWrap { position: relative; }
  #searchBox { border: 0; border-radius: 6px; padding: 6px 10px; width: 180px;
    background: rgba(255,255,255,.25); color: #fff; font: inherit; }
  #searchBox::placeholder { color: rgba(255,255,255,.75); }
  #searchResults { position: absolute; top: 36px; left: 0; width: 320px; max-height: 320px;
    overflow-y: auto; background: var(--surface); color: var(--text); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 60; }
  #searchResults button { display: block; width: 100%; text-align: left; border: 0;
    background: transparent; color: var(--text); padding: 8px 12px; cursor: pointer; font: inherit; }
  #searchResults button:hover { background: var(--list-bg); }
  #searchResults .where { font-size: 12px; color: var(--muted); }

  main { padding: 16px; }
  .hidden { display: none !important; }

  #loginView { max-width: 340px; margin: 10vh auto; background: var(--surface);
    padding: 24px; border-radius: 12px; box-shadow: var(--shadow); }
  #loginView h2 { margin-top: 0; }

  /* Danh sách board */
  #boardsView h2 { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  body:not([data-bg]) #boardsView h2 { color: var(--text); text-shadow: none; }
  #boardsView h2 { font-size: 16px; margin: 18px 0 10px; }
  .boards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .board-tile { color: #fff; border-radius: 10px; padding: 14px;
    min-height: 84px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
    border: 0; text-align: left; font: inherit; position: relative; }
  .board-tile[data-bg="blue"]   { background: linear-gradient(160deg,#0079bf,#5067c5); }
  .board-tile[data-bg="ocean"]  { background: linear-gradient(160deg,#00629e,#00b8d9); }
  .board-tile[data-bg="sunset"] { background: linear-gradient(160deg,#e8673a,#d04a9b); }
  .board-tile[data-bg="forest"] { background: linear-gradient(160deg,#216e4e,#5aac44); }
  .board-tile[data-bg="berry"]  { background: linear-gradient(160deg,#6e2b62,#b14bb8); }
  .board-tile[data-bg="slate"]  { background: linear-gradient(160deg,#42526e,#6b778c); }
  .board-tile[data-bg="sky"]    { background: linear-gradient(160deg,#4b9fe0,#8fd0ef); }
  .board-tile[data-bg="rose"]   { background: linear-gradient(160deg,#c9372c,#f87462); }
  .board-tile .n { opacity: .85; font-size: 12px; }
  .board-tile .star { position: absolute; top: 8px; right: 8px; background: transparent;
    border: 0; font-size: 16px; cursor: pointer; opacity: .85; color: #fff; }
  .board-tile.new { background: rgba(255,255,255,.25); color: #fff;
    align-items: center; justify-content: center; }
  body:not([data-bg]) .board-tile.new { background: var(--list-bg); color: var(--muted); }

  /* Kanban */
  #boardView { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto;
    min-height: calc(100vh - 110px); padding-bottom: 16px; }
  .list { background: var(--list-bg); border-radius: var(--radius); width: 280px; flex: 0 0 280px;
    padding: 8px; box-shadow: var(--shadow); }
  .list-header { display: flex; align-items: center; padding: 4px 6px; gap: 6px; }
  .list-header input { flex: 1; border: 0; background: transparent; color: var(--text);
    font-weight: 700; font-size: 14px; min-width: 0; }
  .list-header .count { font-size: 12px; color: var(--muted); background: var(--surface);
    border-radius: 10px; padding: 1px 8px; }
  .list-header .del, .checklist-item .del, dialog .del, .panel .del {
    border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .cards { min-height: 8px; max-height: calc(100vh - 220px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .card { background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); cursor: grab; touch-action: none; overflow: hidden; }
  .card .inner { padding: 8px 10px; }
  .card .cover { height: 32px; }
  .card.drag-ghost { position: fixed; z-index: 1000; pointer-events: none; margin: 0;
    transform: rotate(4deg); box-shadow: 0 12px 24px rgba(9,30,66,.45); cursor: grabbing; }
  .card.drag-ghost.dropping { transition: top .18s cubic-bezier(.2,0,0,1), left .18s cubic-bezier(.2,0,0,1), transform .18s cubic-bezier(.2,0,0,1); transform: rotate(0deg); }
  /* Theo số liệu REA đo Trello 10/2026: placeholder viền đứt nét, cột đích sáng viền */
  .card-placeholder { background: rgba(9,30,66,.06); border: 2px dashed rgba(94,108,132,.6);
    border-radius: var(--radius); flex: none; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card-placeholder { background: rgba(255,255,255,.06); border-color: rgba(140,155,171,.6); }
  }
  .list.drag-over { outline: 2px solid var(--accent); outline-offset: -1px; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  .card.shifting { transition: transform .15s ease; }
  .card.filtered-out { display: none; }
  .card .labels { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .card .labels .pill { min-width: 40px; height: 16px; border-radius: 8px; display: inline-flex;
    align-items: center; padding: 0 8px; font-size: 11px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .card .title { word-break: break-word; }
  .card .meta { display: flex; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted);
    flex-wrap: wrap; align-items: center; }
  .badge { border-radius: 4px; padding: 1px 6px; }
  .badge.due-overdue { color: #fff; background: var(--danger); }
  .badge.due-soon { background: var(--warn); color: #172b4d; }
  .badge.due-done { color: #fff; background: var(--ok); }
  .avatars { display: flex; gap: 2px; margin-left: auto; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px;
    font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .progress { height: 6px; background: var(--list-bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); }
  button.add, button.ghost { width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--muted); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button.add:hover, button.ghost:hover { background: rgba(9,30,66,.1); }
  .add-list { flex: 0 0 280px; background: rgba(255,255,255,.3); border-radius: var(--radius); }
  body:not([data-bg]) .add-list { background: rgba(9,30,66,.06); }
  .add-list button.add { color: #fff; }
  body:not([data-bg]) .add-list button.add { color: var(--muted); }

  /* Lịch */
  #calendarView { background: var(--surface); border-radius: 12px; padding: 16px; }
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-head b { font-size: 16px; }
  .cal-head button { border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    background: var(--list-bg); color: var(--text); font: inherit; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .dow { font-size: 12px; color: var(--muted); text-align: center; padding: 4px; }
  .cal-cell { min-height: 92px; background: var(--bg); border-radius: 6px; padding: 4px;
    font-size: 12px; }
  .cal-cell.other { opacity: .45; }
  .cal-cell.today { outline: 2px solid var(--accent); }
  .cal-cell .d { color: var(--muted); margin-bottom: 2px; }
  .cal-card { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow);
    padding: 2px 6px; margin-bottom: 3px; cursor: pointer; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; border-left: 3px solid var(--accent); }
  .cal-card.done { border-left-color: var(--ok); opacity: .7; }
  .cal-card.overdue { border-left-color: var(--danger); }

  /* Bộ lọc popover */
  .popover { position: absolute; top: 44px; right: 12px; width: 300px; background: var(--surface);
    color: var(--text); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 50;
    padding: 14px; }
  .popover h4 { margin: 10px 0 6px; font-size: 12px; color: var(--muted); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid rgba(128,128,128,.4); border-radius: 14px; padding: 3px 10px;
    cursor: pointer; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Panel menu board */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; background: var(--surface);
    color: var(--text); box-shadow: -4px 0 16px rgba(0,0,0,.3); z-index: 55; padding: 16px;
    overflow-y: auto; }
  .panel h3 { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .back { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .panel .close { position: absolute; top: 12px; right: 12px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 16px; }
  .panel .item { display: block; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; font: inherit; }
  .panel .item:hover { background: var(--list-bg); }
  .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bg-grid button { height: 56px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .bg-grid button.on { border-color: var(--text); }
  .activity-item { padding: 8px 4px; border-bottom: 1px solid rgba(128,128,128,.2); font-size: 13px; }
  .activity-item .when { color: var(--muted); font-size: 11px; }
  .arch-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px;
    border-bottom: 1px solid rgba(128,128,128,.2); font-size: 13px; }
  .arch-item span { flex: 1; }
  .rule-item { padding: 8px; background: var(--bg); border-radius: 8px; margin-bottom: 8px;
    font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .rule-item span { flex: 1; }

  dialog { border: 0; border-radius: 12px; background: var(--surface); color: var(--text);
    width: min(620px, calc(100vw - 32px)); padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.35);
    max-height: 88vh; overflow-y: auto; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog[open] { animation: dialog-in .18s cubic-bezier(.2,0,0,1); }
  dialog[open]::backdrop { animation: backdrop-in .18s ease; }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=password], input[type=date], textarea, select.field {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4);
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  .cover-picker, .label-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .cover-picker button { width: 44px; height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .cover-picker button.none { background: var(--bg); color: var(--muted); font-size: 11px; width: auto; padding: 0 8px; }
  .cover-picker button.on { border-color: var(--text); }
  .label-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .label-row .swatch { flex: 1; height: 26px; border-radius: 6px; color: #fff; display: flex;
    align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 2px solid transparent; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .label-row .swatch.on { border-color: var(--text); }
  .member-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .checklist-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .checklist-item input[type=text] { flex: 1; }
  .attachment-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .attachment-row a { color: var(--accent); word-break: break-all; flex: 1; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .dialog-actions button, .btn { border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: transparent; color: var(--danger); margin-left: auto; }
  .comment { padding: 8px 10px; background: var(--bg); border-radius: 8px; margin: 6px 0; }
  .comment .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
  table.users { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.users td, table.users th { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(128,128,128,.25); font-size: 13px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: .95; }
  /* Thông báo 🔔 */
  #notifWrap { position: relative; }
  #notifBtn .dot { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff;
    border-radius: 10px; font-size: 10px; min-width: 16px; height: 16px; line-height: 16px;
    padding: 0 3px; font-weight: 700; }
  #notifBtn { position: relative; }
  #notifPop { position: absolute; top: 38px; right: 0; width: 360px; max-height: 440px; overflow-y: auto;
    background: var(--surface); color: var(--text); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 70; }
  #notifPop .head { display: flex; align-items: center; padding: 10px 12px; font-weight: 700;
    border-bottom: 1px solid rgba(128,128,128,.25); }
  #notifPop .head button { margin-left: auto; border: 0; background: transparent; color: var(--accent);
    cursor: pointer; font-size: 12px; }
  .notif-item { display: block; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--text); padding: 10px 12px; cursor: pointer; font: inherit;
    border-bottom: 1px solid rgba(128,128,128,.15); }
  .notif-item:hover { background: var(--list-bg); }
  .notif-item.unread { background: rgba(87,157,255,.1); font-weight: 600; }
  .notif-item .when { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .notif-empty { padding: 20px; color: var(--muted); font-size: 13px; text-align: center; }

  /* Inbox 📥 — panel trái */
  #inboxPanel { position: fixed; top: 0; left: 0; bottom: 0; width: 320px; background: var(--surface);
    color: var(--text); box-shadow: 4px 0 16px rgba(0,0,0,.3); z-index: 55; padding: 16px; overflow-y: auto; }
  #inboxPanel h3 { margin: 0 0 10px; }
  #inboxPanel .close { position: absolute; top: 12px; right: 12px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 16px; }
  .inbox-item { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .inbox-item .row2 { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .inbox-item .row2 button, .inbox-item .row2 input[type=date] { font-size: 12px; padding: 3px 8px;
    border-radius: 6px; border: 1px solid rgba(128,128,128,.35); background: var(--surface);
    color: var(--text); cursor: pointer; width: auto; }
  .inbox-item select { font-size: 12px; padding: 3px; border-radius: 6px; max-width: 110px;
    background: var(--surface); color: var(--text); border: 1px solid rgba(128,128,128,.35); }

  /* Planner tuần 🗓 */
  #plannerView { background: var(--surface); border-radius: 12px; padding: 16px; }
  .plan-layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  .plan-side h4 { margin: 8px 0 6px; font-size: 12px; color: var(--muted); }
  .plan-chip { background: var(--bg); border-radius: 6px; padding: 6px 8px; margin: 4px 0; font-size: 13px;
    cursor: grab; border-left: 3px solid var(--accent); }
  .plan-chip .src { font-size: 11px; color: var(--muted); }
  .plan-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .plan-day { background: var(--bg); border-radius: 8px; min-height: 160px; padding: 6px; font-size: 12px; }
  .plan-day.today { outline: 2px solid var(--accent); }
  .plan-day.dragover { outline: 2px dashed var(--accent); }
  .plan-day .dh { color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .plan-slot { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); padding: 4px 6px;
    margin-bottom: 4px; cursor: pointer; display: flex; gap: 4px; align-items: baseline; }
  .plan-slot span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-slot .del { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
  .plan-slot.inbox-slot { border-left: 3px solid var(--warn); }
  .plan-slot.done { opacity: .6; text-decoration: line-through; }

  /* Cover ảnh + vote + WIP */
  .card .cover.img { height: 130px; background-size: cover; background-position: center; }
  .badge.vote { cursor: pointer; }
  .badge.vote.mine { background: var(--accent); color: #fff; }
  .list-header .count.over { background: var(--danger); color: #fff; font-weight: 700; }
  .ai-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ai-row button { font-size: 12px; }
  .ai-out { background: var(--bg); border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 8px;
    white-space: pre-wrap; }
  .cover-picker button.imgcover { width: auto; padding: 0 8px; font-size: 11px; background: var(--list-bg); color: var(--text); }

  /* Đợt 3: cột thu gọn, menu cột, hoàn thành thẻ, sửa nhanh */
  .list.collapsed { width: 42px; flex: 0 0 42px; cursor: pointer; padding: 8px 4px; }
  .list.collapsed .cards, .list.collapsed button.add { display: none; }
  .list.collapsed .list-header { flex-direction: column; gap: 8px; padding: 2px; }
  .list.collapsed .list-header input { writing-mode: vertical-rl; height: auto; min-height: 140px;
    cursor: pointer; pointer-events: none; }
  .list.collapsed .list-header .del { display: none; }
  .minimenu { position: fixed; background: var(--surface); color: var(--text); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 80; padding: 8px; width: 230px; }
  .minimenu h5 { margin: 8px 4px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .minimenu button.mi { display: block; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--text); padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .minimenu button.mi:hover { background: var(--list-bg); }
  .minimenu .swatches { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 4px; }
  .minimenu .swatches button { width: 32px; height: 22px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; }
  .minimenu .swatches button.on { border-color: var(--text); }
  .card { position: relative; }
  .card .qe { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--surface); color: var(--muted); padding: 2px 6px; opacity: 0; transition: opacity .12s;
    box-shadow: var(--shadow); z-index: 2; }
  .card:hover .qe { opacity: 1; }
  .card .cpl { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); flex: none;
    display: none; align-items: center; justify-content: center; font-size: 10px; cursor: pointer;
    background: transparent; color: #fff; padding: 0; line-height: 1; margin-right: 6px; vertical-align: -3px; }
  .card:hover .cpl { display: inline-flex; }
  .card .cpl.done { display: inline-flex; background: var(--ok); border-color: var(--ok); }
  .card .title { display: flex; align-items: baseline; }
  .card .title .t { flex: 1; }
  .card.is-complete .title .t { color: var(--muted); }

  /* Đợt 4: Table view + kéo cột */
  #tableView { background: var(--surface); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
  #tableView table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tableView th { text-align: left; color: var(--muted); font-size: 12px; cursor: pointer;
    padding: 8px; border-bottom: 2px solid rgba(128,128,128,.3); white-space: nowrap; user-select: none; }
  #tableView th.sorted { color: var(--accent); }
  #tableView td { padding: 7px 8px; border-bottom: 1px solid rgba(128,128,128,.15); }
  #tableView tbody tr { cursor: pointer; }
  #tableView tbody tr:hover { background: var(--list-bg); }
  #tableView .pill { display: inline-block; min-width: 28px; height: 14px; border-radius: 7px;
    padding: 0 6px; font-size: 10px; font-weight: 600; color: #fff; margin-right: 3px;
    text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .list-header .grip { cursor: grab; color: var(--muted); user-select: none; touch-action: none;
    padding: 0 2px; font-size: 13px; }
  .list.list-dragging { opacity: .55; outline: 2px dashed var(--accent); }

  @media (max-width: 600px) { .list, .add-list { width: 260px; flex-basis: 260px; } #searchBox { width: 110px; }
    .plan-layout { grid-template-columns: 1fr; } .plan-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
'use strict';
const LABEL_COLORS = ['#61bd4f', '#f2d600', '#ff9f1a', '#eb5a46', '#c377e0', '#0079bf'];
const BG_KEYS = ['blue', 'ocean', 'sunset', 'forest', 'berry', 'slate', 'sky', 'rose'];
const AVATAR_COLORS = ['#0079bf', '#61bd4f', '#ff9f1a', '#eb5a46', '#c377e0', '#00b8d9', '#216e4e', '#b14bb8'];
let token = null;
try { token = localStorage.getItem('kanban-token'); } catch {}
let me = null;
let users = [];
let allBoards = [];
let currentBoardId = null;
let boardData = null;
let ws = null;
let viewMode = 'board'; // 'board' | 'calendar'
let calMonth = null;    // Date đầu tháng đang xem
let pendingOpenCardId = null;
let aiEnabled = false;
let plannerWeekStart = null; // Date thứ 2 của tuần đang xem
const filter = { text: '', members: new Set(), labels: new Set(), due: null, status: null };

// Power-ups bật/tắt theo board (vote, wip, ai)
function powerups() {
  try { return JSON.parse(boardData?.board?.powerups || '{}'); } catch { return {}; }
}

/* ---------- Router #b/<board> #c/<thẻ> #planner ---------- */
let lastHash = '';
function setHash(h) {
  lastHash = h;
  if (location.hash !== h) {
    if (h) location.hash = h;
    else history.replaceState(null, '', location.pathname + location.search);
  }
}
async function applyHash() {
  const h = location.hash;
  lastHash = h;
  if (!me) return;
  const mc = h.match(/^#c\/(\d+)/);
  const mb = h.match(/^#b\/(\d+)/);
  if (mc) {
    try {
      const { board_id } = await api(`/cards/${mc[1]}/locate`);
      pendingOpenCardId = Number(mc[1]);
      if (currentBoardId !== board_id || !boardData) await openBoard(board_id);
      else await loadBoard(board_id, true);
    } catch { showBoards(); }
  } else if (mb) {
    if (currentBoardId !== Number(mb[1])) await openBoard(Number(mb[1]));
  } else if (h === '#planner') {
    showPlanner();
  } else {
    if (currentBoardId !== null || $('boardsView').classList.contains('hidden')) showBoards();
  }
}
window.addEventListener('hashchange', () => { if (location.hash !== lastHash) applyHash(); });

const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { setToken(null); showLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || 'Có lỗi xảy ra'); throw new Error(data.error || res.status); }
  return data;
}

function setToken(t) {
  token = t;
  try { t ? localStorage.setItem('kanban-token', t) : localStorage.removeItem('kanban-token'); } catch {}
}

/* ---------- WebSocket ---------- */
function connectWS() {
  if (!token) return;
  if (ws) { ws.onclose = null; ws.close(); }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${token}`);
  ws.onopen = () => watchBoard(currentBoardId);
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'board-changed' && msg.boardId === currentBoardId) loadBoard(currentBoardId, true);
      if (msg.type === 'boards-changed' && currentBoardId === null && me) loadBoards();
      if (msg.type === 'comments-changed' && editingCard && msg.cardId === editingCard.id) loadComments(editingCard.id);
      if (msg.type === 'notification') refreshNotifCount();
    } catch {}
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}
function watchBoard(boardId) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'watch', boardId }));
}

/* ---------- Điều hướng ---------- */
function showLogin() {
  for (const id of ['boardsView', 'boardView', 'calendarView', 'plannerView', 'inboxPanel', 'notifPop']) $(id).classList.add('hidden');
  $('loginView').classList.remove('hidden');
  for (const id of ['adminBtn', 'pwBtn', 'logoutBtn', 'searchWrap', 'filterBtn', 'menuBtn', 'starBtn', 'viewBoardBtn', 'viewCalBtn', 'viewTableBtn', 'inboxBtn', 'plannerBtn', 'notifWrap'])
    $(id).classList.add('hidden');
  $('whoami').textContent = '';
  $('boardTitle').textContent = '';
  delete document.body.dataset.bg;
}

async function showApp() {
  $('loginView').classList.add('hidden');
  $('whoami').textContent = me.name;
  for (const id of ['pwBtn', 'logoutBtn', 'searchWrap', 'inboxBtn', 'plannerBtn', 'notifWrap'])
    $(id).classList.remove('hidden');
  if (me.is_admin) $('adminBtn').classList.remove('hidden');
  users = (await api('/users')).users;
  connectWS();
  api('/ai/status').then(r => { aiEnabled = !!r.enabled; }).catch(() => {});
  refreshNotifCount();
  allBoards = (await api('/boards')).boards;
  if (location.hash) applyHash();
  else showBoards();
}

async function showBoards() {
  currentBoardId = null;
  boardData = null;
  viewMode = 'board';
  setHash('');
  watchBoard(null);
  for (const id of ['boardView', 'calendarView', 'plannerView']) $(id).classList.add('hidden');
  for (const id of ['filterBtn', 'menuBtn', 'starBtn', 'viewBoardBtn', 'viewCalBtn', 'viewTableBtn']) $(id).classList.add('hidden');
  $('filterPop').classList.add('hidden');
  $('boardMenu').classList.add('hidden');
  $('boardsView').classList.remove('hidden');
  $('boardTitle').textContent = '';
  delete document.body.dataset.bg;
  await loadBoards();
}

function boardTile(b) {
  const tile = document.createElement('button');
  tile.className = 'board-tile';
  tile.dataset.bg = BG_KEYS.includes(b.background) ? b.background : 'blue';
  const name = document.createElement('span');
  name.textContent = b.title;
  const n = document.createElement('span');
  n.className = 'n';
  n.textContent = b.card_count + ' thẻ';
  const star = document.createElement('button');
  star.className = 'star';
  star.textContent = b.starred ? '⭐' : '☆';
  star.title = 'Gắn sao';
  star.onclick = async e => {
    e.stopPropagation();
    await api(`/boards/${b.id}/star`, { method: 'POST' });
    loadBoards();
  };
  tile.append(star, name, n);
  tile.onclick = () => openBoard(b.id);
  return tile;
}

async function loadBoards() {
  allBoards = (await api('/boards')).boards;
  const open = allBoards.filter(b => !b.closed);
  const starred = open.filter(b => b.starred);
  const closed = allBoards.filter(b => b.closed);

  $('starredSection').classList.toggle('hidden', starred.length === 0);
  const sg = $('starredGrid');
  sg.innerHTML = '';
  for (const b of starred) sg.appendChild(boardTile(b));

  const grid = $('boardsGrid');
  grid.innerHTML = '';
  for (const b of open) grid.appendChild(boardTile(b));
  const add = document.createElement('button');
  add.className = 'board-tile new';
  add.textContent = '+ Tạo board mới';
  add.onclick = async () => {
    const title = prompt('Tên board (ví dụ: Sản xuất video, Mục tiêu quý 4…)');
    if (title && title.trim()) {
      const bg = BG_KEYS[Math.floor(Math.random() * BG_KEYS.length)];
      const { id } = await api('/boards', { method: 'POST', body: { title: title.trim(), background: bg } });
      openBoard(id);
    }
  };
  grid.appendChild(add);

  $('closedSection').classList.toggle('hidden', closed.length === 0);
  const cg = $('closedGrid');
  cg.innerHTML = '';
  for (const b of closed) {
    const t = boardTile(b);
    t.style.opacity = .6;
    t.onclick = async () => {
      if (confirm(`Mở lại board "${b.title}"?`)) {
        await api('/boards/' + b.id, { method: 'PATCH', body: { closed: false } });
        loadBoards();
      }
    };
    cg.appendChild(t);
  }
}

async function openBoard(id) {
  currentBoardId = id;
  setHash('#b/' + id);
  for (const el of ['boardsView', 'plannerView']) $(el).classList.add('hidden');
  for (const el of ['filterBtn', 'menuBtn', 'starBtn', 'viewBoardBtn', 'viewCalBtn', 'viewTableBtn']) $(el).classList.remove('hidden');
  watchBoard(id);
  setViewMode('board');
  await loadBoard(id);
}

function setViewMode(mode) {
  viewMode = mode;
  $('viewBoardBtn').classList.toggle('on', mode === 'board');
  $('viewCalBtn').classList.toggle('on', mode === 'calendar');
  $('viewTableBtn').classList.toggle('on', mode === 'table');
  $('boardView').classList.toggle('hidden', mode !== 'board');
  $('calendarView').classList.toggle('hidden', mode !== 'calendar');
  $('tableView').classList.toggle('hidden', mode !== 'table');
  if (boardData) render();
}

/* ---------- Tải & render board ---------- */
async function loadBoard(id, isRefresh = false) {
  boardData = await api('/boards/' + id);
  if (currentBoardId !== id) return;
  const b = boardData.board;
  $('boardTitle').textContent = '› ' + b.title;
  $('starBtn').textContent = allBoards.find(x => x.id === id)?.starred ? '⭐' : '☆';
  document.body.dataset.bg = BG_KEYS.includes(b.background) ? b.background : 'blue';
  if (drag.active) { drag.pendingRefresh = true; return; }
  render();
  if (pendingOpenCardId) {
    const c = boardData.cards.find(x => x.id === pendingOpenCardId);
    pendingOpenCardId = null;
    if (c) openCardDialog(c);
  }
  if (isRefresh && editingCard) {
    const fresh = boardData.cards.find(c => c.id === editingCard.id);
    if (!fresh) { $('cardDialog').close(); toast('Thẻ này vừa bị lưu trữ hoặc xóa'); }
  }
}

function render() {
  if (viewMode === 'board') renderBoard();
  else if (viewMode === 'table') renderTable();
  else renderCalendar();
  renderFilterPop();
}

const cardsOf = listId => boardData.cards.filter(c => c.list_id === listId);
const checklistOf = cardId => boardData.checklist.filter(i => i.card_id === cardId);
const labelsOf = cardId => boardData.cardLabels.filter(x => x.card_id === cardId).map(x => x.label_id);
const membersOf = cardId => boardData.cardMembers.filter(x => x.card_id === cardId);
const labelById = id => boardData.labels.find(l => l.id === id);

function filterActive() {
  return filter.text || filter.members.size || filter.labels.size || filter.due || filter.status;
}

function cardMatchesFilter(c) {
  if (!filterActive()) return true;
  if (filter.text && !c.title.toLowerCase().includes(filter.text.toLowerCase())) return false;
  if (filter.members.size) {
    const ms = membersOf(c.id).map(m => m.user_id);
    const hit = [...filter.members].some(id =>
      id === 'none' ? ms.length === 0 : id === 'me' ? ms.includes(me.id) : ms.includes(id));
    if (!hit) return false;
  }
  if (filter.labels.size) {
    const ls = labelsOf(c.id);
    const hit = [...filter.labels].some(id => id === 'none' ? ls.length === 0 : ls.includes(id));
    if (!hit) return false;
  }
  if (filter.status === 'done' && !c.due_complete) return false;
  if (filter.status === 'undone' && c.due_complete) return false;
  if (filter.due) {
    const today = new Date().toISOString().slice(0, 10);
    const week = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    if (filter.due === 'overdue' && !(c.due_date && c.due_date < today && !c.due_complete)) return false;
    if (filter.due === 'week' && !(c.due_date && c.due_date >= today && c.due_date <= week)) return false;
    if (filter.due === 'none' && c.due_date) return false;
  }
  return true;
}

function renderBoard() {
  const root = $('boardView');
  root.innerHTML = '';
  for (const list of boardData.lists) root.appendChild(renderList(list));
  const addList = document.createElement('div');
  addList.className = 'add-list';
  const btn = document.createElement('button');
  btn.className = 'add';
  btn.textContent = '+ Thêm cột';
  btn.onclick = async () => {
    const title = prompt('Tên cột?');
    if (title && title.trim()) await api('/lists', { method: 'POST', body: { board_id: currentBoardId, title: title.trim() } });
  };
  addList.appendChild(btn);
  root.appendChild(addList);
  $('filterBtn').classList.toggle('on', !!filterActive());
}

/* Thu gọn cột: lưu theo người dùng trong trình duyệt */
function collapsedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('kanban-collapsed-' + currentBoardId) || '[]')); }
  catch { return new Set(); }
}
function toggleCollapsed(listId) {
  const s = collapsedSet();
  s.has(listId) ? s.delete(listId) : s.add(listId);
  try { localStorage.setItem('kanban-collapsed-' + currentBoardId, JSON.stringify([...s])); } catch {}
  renderBoard();
}

function renderList(list) {
  const el = document.createElement('section');
  el.className = 'list';
  el.dataset.listEl = list.id;
  if (list.color) el.style.background = `color-mix(in srgb, ${list.color} 32%, var(--list-bg))`;

  const header = document.createElement('div');
  header.className = 'list-header';
  const nameInput = document.createElement('input');
  nameInput.value = list.title;
  nameInput.onchange = () => api('/lists/' + list.id, { method: 'PATCH', body: { title: nameInput.value.trim() || list.title } });
  const cards = cardsOf(list.id);
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = cards.length;
  if (powerups().wip && list.wip_limit > 0) {
    count.textContent = `${cards.length}/${list.wip_limit}`;
    if (cards.length > list.wip_limit) count.classList.add('over');
    count.title = 'Giới hạn việc đang làm (WIP) của cột';
  }
  if (powerups().wip) {
    count.style.cursor = 'pointer';
    count.onclick = async () => {
      const v = prompt(`Giới hạn WIP cho cột "${list.title}" (0 = bỏ giới hạn):`, list.wip_limit || 0);
      if (v !== null) await api('/lists/' + list.id, { method: 'PATCH', body: { wip_limit: Number(v) || 0 } });
    };
  }

  if (collapsedSet().has(list.id)) {
    el.classList.add('collapsed');
    el.title = 'Bấm để mở rộng cột';
    el.onclick = () => toggleCollapsed(list.id);
    header.append(count, nameInput);
    el.appendChild(header);
    return el;
  }

  const menuBtn = document.createElement('button');
  menuBtn.className = 'del';
  menuBtn.textContent = '⋯';
  menuBtn.title = 'Thao tác với cột';
  menuBtn.onclick = e => { e.stopPropagation(); openListMenu(list, menuBtn); };
  const grip = document.createElement('span');
  grip.className = 'grip';
  grip.textContent = '⠿';
  grip.title = 'Kéo để sắp xếp cột';
  grip.addEventListener('pointerdown', e => startListDrag(e, list, el));
  header.append(grip, nameInput, count, menuBtn);

  const cardsEl = document.createElement('div');
  cardsEl.className = 'cards';
  cardsEl.dataset.listId = list.id;
  for (const c of cards) cardsEl.appendChild(renderCard(c));

  const addBtn = document.createElement('button');
  addBtn.className = 'add';
  addBtn.textContent = '+ Thêm thẻ';
  addBtn.onclick = async () => {
    const title = prompt('Nội dung công việc?');
    if (title && title.trim()) await api('/cards', { method: 'POST', body: { list_id: list.id, title: title.trim() } });
  };

  el.append(header, cardsEl, addBtn);
  return el;
}

document.addEventListener('click', e => {
  if (!e.target.isConnected) return;
  if (!e.target.closest('.minimenu')) closeMiniMenu();
});

function avatarEl(name, userId) {
  const a = document.createElement('span');
  a.className = 'avatar';
  a.style.background = AVATAR_COLORS[userId % AVATAR_COLORS.length];
  const parts = name.trim().split(/\s+/);
  a.textContent = (parts.length > 1 ? parts[0][0] + parts.at(-1)[0] : name.slice(0, 2)).toUpperCase();
  a.title = name;
  return a;
}

function dueBadge(c) {
  if (!c.due_date) return null;
  const today = new Date().toISOString().slice(0, 10);
  const soon = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  const span = document.createElement('span');
  let cls = '';
  if (c.due_complete) cls = 'due-done';
  else if (c.due_date < today) cls = 'due-overdue';
  else if (c.due_date <= soon) cls = 'due-soon';
  span.className = 'badge ' + cls;
  span.textContent = '🕐 ' + c.due_date.split('-').reverse().slice(0, 2).join('/') +
    (c.due_time ? ' ' + c.due_time : '') + (c.recur ? ' 🔁' : '');
  if (c.start_date) span.title = 'Bắt đầu ' + c.start_date.split('-').reverse().slice(0, 2).join('/');
  return span;
}

function renderCard(c) {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.cardId = c.id;
  if (!cardMatchesFilter(c)) el.classList.add('filtered-out');

  if (c.cover) {
    const cover = document.createElement('div');
    cover.className = 'cover';
    if (c.cover.startsWith('url:')) {
      cover.classList.add('img');
      cover.style.backgroundImage = `url("${c.cover.slice(4)}")`;
    } else cover.style.background = c.cover;
    el.appendChild(cover);
  }
  const inner = document.createElement('div');
  inner.className = 'inner';

  const labelIds = labelsOf(c.id);
  if (labelIds.length) {
    const wrap = document.createElement('div');
    wrap.className = 'labels';
    for (const id of labelIds) {
      const l = labelById(id);
      if (!l) continue;
      const s = document.createElement('span');
      s.className = 'pill';
      s.style.background = l.color;
      s.textContent = l.name || '';
      s.title = l.name;
      wrap.appendChild(s);
    }
    inner.appendChild(wrap);
  }

  if (c.due_complete) el.classList.add('is-complete');
  const title = document.createElement('div');
  title.className = 'title';
  const cpl = document.createElement('button');
  cpl.className = 'cpl' + (c.due_complete ? ' done' : '');
  cpl.textContent = c.due_complete ? '✓' : '';
  cpl.title = c.due_complete ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành thẻ';
  cpl.addEventListener('pointerdown', e => e.stopPropagation());
  cpl.onclick = e => {
    e.stopPropagation();
    api('/cards/' + c.id, { method: 'PATCH', body: { due_complete: !c.due_complete } });
  };
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = c.title;
  title.append(cpl, t);
  inner.appendChild(title);

  const qe = document.createElement('button');
  qe.className = 'qe';
  qe.textContent = '✎';
  qe.title = 'Sửa nhanh tiêu đề';
  qe.addEventListener('pointerdown', e => e.stopPropagation());
  qe.onclick = e => {
    e.stopPropagation();
    const v = prompt('Tiêu đề thẻ:', c.title);
    if (v !== null && v.trim() && v.trim() !== c.title) {
      api('/cards/' + c.id, { method: 'PATCH', body: { title: v.trim() } });
    }
  };
  el.appendChild(qe);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const due = dueBadge(c);
  if (due) meta.appendChild(due);
  const items = checklistOf(c.id);
  if (items.length) {
    const done = items.filter(i => i.checked).length;
    const chk = document.createElement('span');
    chk.textContent = `☑ ${done}/${items.length}`;
    meta.appendChild(chk);
  }
  const commentCount = (boardData.commentCounts.find(x => x.card_id === c.id) || {}).n || 0;
  if (commentCount) {
    const cm = document.createElement('span');
    cm.textContent = '💬 ' + commentCount;
    meta.appendChild(cm);
  }
  const attachCount = (boardData.attachmentCounts.find(x => x.card_id === c.id) || {}).n || 0;
  if (attachCount) {
    const at = document.createElement('span');
    at.textContent = '📎 ' + attachCount;
    meta.appendChild(at);
  }
  if (powerups().vote) {
    const n = (boardData.voteCounts?.find(x => x.card_id === c.id) || {}).n || 0;
    const mine = boardData.myVotes?.includes(c.id);
    if (n || mine) {
      const v = document.createElement('span');
      v.className = 'badge vote' + (mine ? ' mine' : '');
      v.textContent = '👍 ' + n;
      v.title = 'Vote cho thẻ';
      v.onclick = e => { e.stopPropagation(); api(`/cards/${c.id}/vote`, { method: 'POST' }); };
      meta.appendChild(v);
    }
  }
  if (c.description) {
    const d = document.createElement('span');
    d.textContent = '≡';
    d.title = 'Có mô tả';
    meta.appendChild(d);
  }
  const members = membersOf(c.id);
  if (members.length) {
    const av = document.createElement('span');
    av.className = 'avatars';
    for (const m of members.slice(0, 4)) av.appendChild(avatarEl(m.name, m.user_id));
    meta.appendChild(av);
  }
  if (meta.children.length) inner.appendChild(meta);

  if (items.length) {
    const done = items.filter(i => i.checked).length;
    const bar = document.createElement('div');
    bar.className = 'progress';
    const fill = document.createElement('i');
    fill.style.width = Math.round(done / items.length * 100) + '%';
    bar.appendChild(fill);
    inner.appendChild(bar);
  }
  el.appendChild(inner);

  el.addEventListener('pointerdown', e => startCardDrag(e, c, el));
  el.addEventListener('click', () => {
    if (drag.suppressClick) { drag.suppressClick = false; return; }
    openCardDialog(c);
  });
  return el;
}

/* ---------- Kéo-thả sắp xếp CỘT (bằng tay cầm ⠿) ---------- */
function startListDrag(e, list, listEl) {
  e.preventDefault();
  e.stopPropagation();
  listEl.classList.add('list-dragging');
  const root = $('boardView');

  const move = ev => {
    const others = [...root.querySelectorAll('.list')].filter(x => x !== listEl);
    let before = null;
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { before = o; break; }
    }
    const already = before ? listEl.nextElementSibling === before
                           : listEl === [...root.querySelectorAll('.list')].at(-1);
    if (already) return;
    flipShift(() => {
      if (before) root.insertBefore(listEl, before);
      else root.insertBefore(listEl, root.querySelector('.add-list'));
    });
  };

  const up = async () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    listEl.classList.remove('list-dragging');
    const order = [...root.querySelectorAll('.list')].map(x => Number(x.dataset.listEl));
    const idx = order.indexOf(list.id);
    const byId = id => boardData.lists.find(l => l.id === id);
    const prev = byId(order[idx - 1]);
    const next = byId(order[idx + 1]);
    let position;
    if (!prev && !next) position = list.position;
    else if (!prev) position = next.position - 512;
    else if (!next) position = prev.position + 1024;
    else position = (prev.position + next.position) / 2;
    if (position !== list.position) {
      list.position = position;
      boardData.lists.sort((a, b) => a.position - b.position || a.id - b.id);
      await api('/lists/' + list.id, { method: 'PATCH', body: { position } });
    }
  };

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

/* ---------- Kéo-thả kiểu Trello ---------- */
const drag = { active: false, suppressClick: false, pendingRefresh: false };

function startCardDrag(e, c, cardEl) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY;
  const rect = cardEl.getBoundingClientRect();
  const offsetX = startX - rect.left, offsetY = startY - rect.top;
  let started = false, ghost = null, placeholder = null;

  const begin = () => {
    started = true;
    drag.active = true;
    drag.suppressClick = true;
    document.body.classList.add('is-dragging');
    ghost = cardEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);
    placeholder = document.createElement('div');
    placeholder.className = 'card-placeholder';
    placeholder.style.height = rect.height + 'px';
    cardEl.replaceWith(placeholder);
  };

  const move = ev => {
    if (!started) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) return;
      begin();
    }
    ghost.style.left = (ev.clientX - offsetX) + 'px';
    ghost.style.top = (ev.clientY - offsetY) + 'px';
    autoScrollBoard(ev);
    positionPlaceholder(ev, placeholder);
  };

  const up = async () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (!started) return;
    const target = placeholder.getBoundingClientRect();
    ghost.classList.add('dropping');
    ghost.style.left = target.left + 'px';
    ghost.style.top = target.top + 'px';
    const cardsEl = placeholder.closest('.cards');
    const listId = Number(cardsEl.dataset.listId);
    const slots = [...cardsEl.children].filter(n => (n.classList.contains('card') && !n.classList.contains('filtered-out')) || n === placeholder);
    const index = slots.indexOf(placeholder);
    await new Promise(r => setTimeout(r, 190));
    ghost.remove();
    document.body.classList.remove('is-dragging');
    drag.active = false;
    commitDrop(c.id, listId, index);
  };

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function positionPlaceholder(ev, placeholder) {
  const containers = [...document.querySelectorAll('.cards')];
  let target = null;
  for (const el of containers) {
    const r = el.closest('.list').getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right) { target = el; break; }
  }
  if (!target) return;
  const cards = [...target.children].filter(n => n.classList.contains('card') && !n.classList.contains('filtered-out'));
  let insertBefore = null;
  for (const el of cards) {
    const r = el.getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2) { insertBefore = el; break; }
  }
  const already = placeholder.parentElement === target &&
    (insertBefore ? placeholder.nextElementSibling === insertBefore
                  : placeholder === [...target.children].at(-1));
  // Cột đích sáng viền trong lúc kéo (theo hành vi Trello bản mới, đo 10/2026)
  for (const l of document.querySelectorAll('.list.drag-over')) {
    if (l !== target.closest('.list')) l.classList.remove('drag-over');
  }
  target.closest('.list')?.classList.add('drag-over');
  if (already) return;
  flipShift(() => {
    if (insertBefore) target.insertBefore(placeholder, insertBefore);
    else target.appendChild(placeholder);
  });
}

function flipShift(mutate) {
  const cards = [...document.querySelectorAll('.card')].filter(el => !el.classList.contains('drag-ghost'));
  const before = new Map(cards.map(el => [el, el.getBoundingClientRect()]));
  mutate();
  for (const el of cards) {
    const b = before.get(el);
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (dx || dy) {
      el.classList.remove('shifting');
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        el.classList.add('shifting');
        el.style.transform = '';
      });
    }
  }
}

function autoScrollBoard(ev) {
  const bv = $('boardView');
  const r = bv.getBoundingClientRect();
  if (ev.clientX > r.right - 60) bv.scrollLeft += 14;
  else if (ev.clientX < r.left + 60) bv.scrollLeft -= 14;
  const cardsEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.cards');
  if (cardsEl) {
    const cr = cardsEl.getBoundingClientRect();
    if (ev.clientY > cr.bottom - 40) cardsEl.scrollTop += 10;
    else if (ev.clientY < cr.top + 40) cardsEl.scrollTop -= 10;
  }
}

function commitDrop(cardId, listId, index) {
  const visible = cardsOf(listId).filter(x => x.id !== cardId && cardMatchesFilter(x));
  const before = visible[index - 1];
  const after = visible[index];
  let position;
  if (!before && !after) position = 1024;
  else if (!before) position = after.position - 512;
  else if (!after) position = before.position + 1024;
  else position = (before.position + after.position) / 2;
  const card = boardData.cards.find(x => x.id === cardId);
  if (card) {
    card.list_id = listId;
    card.position = position;
    boardData.cards.sort((a, b) => a.position - b.position || a.id - b.id);
  }
  renderBoard();
  api('/cards/' + cardId, { method: 'PATCH', body: { list_id: listId, position } });
  if (drag.pendingRefresh) {
    drag.pendingRefresh = false;
    loadBoard(currentBoardId, true);
  }
}

/* ---------- Chế độ xem Lịch ---------- */
function renderCalendar() {
  if (!calMonth) {
    const now = new Date();
    calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  const root = $('calendarView');
  root.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'cal-head';
  const prev = document.createElement('button');
  prev.textContent = '‹';
  prev.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); };
  const next = document.createElement('button');
  next.textContent = '›';
  next.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); };
  const todayBtn = document.createElement('button');
  todayBtn.textContent = 'Hôm nay';
  todayBtn.onclick = () => { calMonth = null; renderCalendar(); };
  const title = document.createElement('b');
  title.textContent = `Tháng ${calMonth.getMonth() + 1}/${calMonth.getFullYear()}`;
  head.append(prev, title, next, todayBtn);
  root.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  for (const d of ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN']) {
    const h = document.createElement('div');
    h.className = 'dow';
    h.textContent = d;
    grid.appendChild(h);
  }
  const first = new Date(calMonth);
  const startOffset = (first.getDay() + 6) % 7; // Thứ 2 đầu tuần
  const start = new Date(first);
  start.setDate(1 - startOffset);
  const todayStr = new Date().toISOString().slice(0, 10);
  const byDate = {};
  for (const c of boardData.cards) {
    if (c.due_date && cardMatchesFilter(c)) (byDate[c.due_date] = byDate[c.due_date] || []).push(c);
  }
  for (let i = 0; i < 42; i++) {
    const day = new Date(start);
    day.setDate(start.getDate() + i);
    const iso = day.toISOString().slice(0, 10);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (day.getMonth() !== calMonth.getMonth()) cell.classList.add('other');
    if (iso === todayStr) cell.classList.add('today');
    const d = document.createElement('div');
    d.className = 'd';
    d.textContent = day.getDate();
    cell.appendChild(d);
    for (const c of byDate[iso] || []) {
      const cc = document.createElement('div');
      cc.className = 'cal-card' + (c.due_complete ? ' done' : (iso < todayStr ? ' overdue' : ''));
      cc.textContent = c.title;
      cc.title = c.title;
      cc.onclick = () => openCardDialog(c);
      cell.appendChild(cc);
    }
    grid.appendChild(cell);
  }
  root.appendChild(grid);
}

/* ---------- Thông báo 🔔 ---------- */
async function refreshNotifCount() {
  try {
    const { unread } = await api('/notifications');
    const dot = $('notifDot');
    dot.textContent = unread > 99 ? '99+' : unread;
    dot.classList.toggle('hidden', !unread);
  } catch {}
}

function notifText(n) {
  let d = {};
  try { d = JSON.parse(n.data); } catch {}
  const who = n.actor_name || '';
  const card = `"${n.card_title || d.title || 'thẻ'}"`;
  switch (n.type) {
    case 'assigned': return `${who} đã gán bạn vào ${card}`;
    case 'mention': return `${who} đã nhắc bạn trong ${card}: “${d.text || ''}”`;
    case 'comment': return `${who} đã bình luận vào ${card}: “${d.text || ''}”`;
    case 'moved': return `${who} đã chuyển ${card} từ "${d.from}" sang "${d.to}"`;
    case 'due_soon': return `⏰ ${card} đến hạn ${d.due?.split('-').reverse().slice(0, 2).join('/')}`;
    case 'due_overdue': return `🔴 ${card} đã TRỄ HẠN (${d.due?.split('-').reverse().slice(0, 2).join('/')})`;
    case 'completed': return `✅ ${who} đã hoàn thành ${card}`;
    case 'created': return `🆕 ${who} đã tạo ${card} trên board bạn theo dõi`;
    default: return n.type;
  }
}

async function openNotifPop() {
  const pop = $('notifPop');
  pop.innerHTML = '';
  pop.classList.remove('hidden');
  const { notifications } = await api('/notifications');
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = 'Thông báo';
  const markAll = document.createElement('button');
  markAll.textContent = 'Đánh dấu đã đọc hết';
  markAll.onclick = async () => { await api('/notifications/read', { method: 'POST', body: {} }); openNotifPop(); refreshNotifCount(); };
  head.appendChild(markAll);
  pop.appendChild(head);
  if (!notifications.length) {
    const e = document.createElement('div');
    e.className = 'notif-empty';
    e.textContent = 'Chưa có thông báo nào';
    pop.appendChild(e);
  }
  for (const n of notifications) {
    const b = document.createElement('button');
    b.className = 'notif-item' + (n.read ? '' : ' unread');
    const t = document.createElement('div');
    t.textContent = notifText(n);
    const w = document.createElement('div');
    w.className = 'when';
    w.textContent = (n.board_title ? n.board_title + ' · ' : '') + n.created_at + ' UTC';
    b.append(t, w);
    b.onclick = async () => {
      pop.classList.add('hidden');
      if (!n.read) { await api('/notifications/read', { method: 'POST', body: { ids: [n.id] } }); refreshNotifCount(); }
      if (n.card_id) { location.hash = '#c/' + n.card_id; applyHash(); }
    };
    pop.appendChild(b);
  }
}
$('notifBtn').onclick = () => {
  const pop = $('notifPop');
  if (pop.classList.contains('hidden')) openNotifPop();
  else pop.classList.add('hidden');
};

/* ---------- Inbox 📥 — thu việc nhanh ---------- */
async function openInbox() {
  const p = $('inboxPanel');
  p.innerHTML = '';
  p.classList.remove('hidden');
  const close = document.createElement('button');
  close.className = 'close';
  close.textContent = '✕';
  close.onclick = () => p.classList.add('hidden');
  const h = document.createElement('h3');
  h.textContent = '📥 Inbox của tôi';
  const hint = document.createElement('p');
  hint.style.cssText = 'font-size:12px;color:var(--muted);margin:0 0 8px';
  hint.textContent = 'Nháp việc cá nhân — đặt ngày để hiện trong Planner, hoặc chuyển thành thẻ trên board.';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Gõ việc cần nhớ rồi Enter…';
  input.onkeydown = async e => {
    if (e.key === 'Enter' && input.value.trim()) {
      await api('/inbox', { method: 'POST', body: { text: input.value.trim() } });
      openInbox();
    }
  };
  p.append(close, h, hint, input);
  const { items } = await api('/inbox');
  for (const item of items) {
    const row = document.createElement('div');
    row.className = 'inbox-item';
    const txt = document.createElement('div');
    txt.textContent = item.text;
    txt.title = 'Bấm để sửa';
    txt.style.cursor = 'pointer';
    txt.onclick = async () => {
      const v = prompt('Sửa nội dung:', item.text);
      if (v !== null && v.trim()) { await api('/inbox/' + item.id, { method: 'PATCH', body: { text: v.trim() } }); openInbox(); }
    };
    const row2 = document.createElement('div');
    row2.className = 'row2';
    const date = document.createElement('input');
    date.type = 'date';
    date.value = item.date || '';
    date.title = 'Ngày dự định làm (hiện trong Planner)';
    date.onchange = () => api('/inbox/' + item.id, { method: 'PATCH', body: { date: date.value } });
    const boardSel = document.createElement('select');
    boardSel.innerHTML = '<option value="">→ board…</option>';
    for (const b of allBoards.filter(b => !b.closed)) {
      const o = document.createElement('option');
      o.value = b.id;
      o.textContent = b.title;
      boardSel.appendChild(o);
    }
    const listSel = document.createElement('select');
    listSel.classList.add('hidden');
    boardSel.onchange = async () => {
      listSel.innerHTML = '';
      if (!boardSel.value) { listSel.classList.add('hidden'); return; }
      const data = await api('/boards/' + boardSel.value);
      for (const l of data.lists) {
        const o = document.createElement('option');
        o.value = l.id;
        o.textContent = l.title;
        listSel.appendChild(o);
      }
      listSel.classList.remove('hidden');
    };
    const go = document.createElement('button');
    go.textContent = 'Tạo thẻ';
    go.onclick = async () => {
      if (!listSel.value) { toast('Chọn board và cột trước'); return; }
      const r = await api(`/inbox/${item.id}/convert`, { method: 'POST', body: { list_id: Number(listSel.value) } });
      toast('Đã tạo thẻ trên board');
      $('inboxPanel').classList.add('hidden');
      location.hash = '#c/' + r.id;
      applyHash();
    };
    const del = document.createElement('button');
    del.textContent = '✕';
    del.onclick = async () => { await api('/inbox/' + item.id, { method: 'DELETE' }); openInbox(); };
    row2.append(date, boardSel, listSel, go, del);
    row.append(txt, row2);
    p.appendChild(row);
  }
  input.focus();
}
$('inboxBtn').onclick = () => {
  if ($('inboxPanel').classList.contains('hidden')) openInbox();
  else $('inboxPanel').classList.add('hidden');
};

/* ---------- Planner tuần 🗓 ---------- */
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function showPlanner() {
  currentBoardId = null;
  boardData = null;
  setHash('#planner');
  watchBoard(null);
  for (const id of ['boardsView', 'boardView', 'calendarView']) $(id).classList.add('hidden');
  for (const id of ['filterBtn', 'menuBtn', 'starBtn', 'viewBoardBtn', 'viewCalBtn', 'viewTableBtn']) $(id).classList.add('hidden');
  $('boardTitle').textContent = '› Planner của tôi';
  delete document.body.dataset.bg;
  $('plannerView').classList.remove('hidden');
  renderPlanner();
}

async function renderPlanner() {
  if (!plannerWeekStart) {
    const now = new Date();
    plannerWeekStart = new Date(now);
    plannerWeekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // thứ 2
  }
  const data = await api('/planner');
  const root = $('plannerView');
  root.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'cal-head';
  const prev = document.createElement('button');
  prev.textContent = '‹';
  prev.onclick = () => { plannerWeekStart.setDate(plannerWeekStart.getDate() - 7); renderPlanner(); };
  const next = document.createElement('button');
  next.textContent = '›';
  next.onclick = () => { plannerWeekStart.setDate(plannerWeekStart.getDate() + 7); renderPlanner(); };
  const todayBtn = document.createElement('button');
  todayBtn.textContent = 'Tuần này';
  todayBtn.onclick = () => { plannerWeekStart = null; renderPlanner(); };
  const title = document.createElement('b');
  const weekEnd = new Date(plannerWeekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  title.textContent = `🗓 Tuần ${isoDate(plannerWeekStart).slice(8)}/${plannerWeekStart.getMonth() + 1} – ${isoDate(weekEnd).slice(8)}/${weekEnd.getMonth() + 1}`;
  head.append(prev, title, next, todayBtn);
  root.appendChild(head);

  const layout = document.createElement('div');
  layout.className = 'plan-layout';

  // Cột trái: thẻ của tôi (kéo vào ngày)
  const side = document.createElement('div');
  side.className = 'plan-side';
  const h4 = document.createElement('h4');
  h4.textContent = 'THẺ CỦA TÔI — kéo vào ngày để xếp lịch';
  side.appendChild(h4);
  const slotted = new Set(data.slots.map(s => s.card_id));
  for (const c of data.myCards.filter(c => !slotted.has(c.id))) {
    const chip = document.createElement('div');
    chip.className = 'plan-chip';
    chip.draggable = true;
    chip.textContent = c.title;
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = `${c.board_title} › ${c.list_title}` + (c.due_date ? ` · hạn ${c.due_date.split('-').reverse().slice(0, 2).join('/')}` : '');
    chip.appendChild(src);
    chip.ondragstart = e => e.dataTransfer.setData('text/card', String(c.id));
    chip.onclick = () => { location.hash = '#c/' + c.id; applyHash(); };
    side.appendChild(chip);
  }
  layout.appendChild(side);

  // Lưới 7 ngày
  const grid = document.createElement('div');
  grid.className = 'plan-grid';
  const todayStr = isoDate(new Date());
  const slotsByDate = {};
  for (const s of data.slots) (slotsByDate[s.date] = slotsByDate[s.date] || []).push(s);
  const inboxByDate = {};
  for (const i of data.inbox) (inboxByDate[i.date] = inboxByDate[i.date] || []).push(i);
  const DOW = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'];
  for (let i = 0; i < 7; i++) {
    const day = new Date(plannerWeekStart);
    day.setDate(plannerWeekStart.getDate() + i);
    const iso = isoDate(day);
    const cell = document.createElement('div');
    cell.className = 'plan-day' + (iso === todayStr ? ' today' : '');
    const dh = document.createElement('div');
    dh.className = 'dh';
    dh.textContent = `${DOW[i]} ${day.getDate()}/${day.getMonth() + 1}`;
    cell.appendChild(dh);
    cell.ondragover = e => { e.preventDefault(); cell.classList.add('dragover'); };
    cell.ondragleave = () => cell.classList.remove('dragover');
    cell.ondrop = async e => {
      e.preventDefault();
      cell.classList.remove('dragover');
      const cardId = e.dataTransfer.getData('text/card');
      if (cardId) { await api('/planner', { method: 'PUT', body: { card_id: Number(cardId), date: iso } }); renderPlanner(); }
    };
    for (const s of slotsByDate[iso] || []) {
      const slot = document.createElement('div');
      slot.className = 'plan-slot' + (s.due_complete ? ' done' : '');
      slot.draggable = true;
      slot.ondragstart = e => e.dataTransfer.setData('text/card', String(s.card_id));
      const span = document.createElement('span');
      span.textContent = s.title;
      span.title = `${s.board_title} › ${s.list_title}`;
      span.onclick = () => { location.hash = '#c/' + s.card_id; applyHash(); };
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Bỏ khỏi lịch';
      del.onclick = async () => { await api('/planner/' + s.card_id, { method: 'DELETE' }); renderPlanner(); };
      slot.append(span, del);
      cell.appendChild(slot);
    }
    for (const it of inboxByDate[iso] || []) {
      const slot = document.createElement('div');
      slot.className = 'plan-slot inbox-slot';
      const span = document.createElement('span');
      span.textContent = '📥 ' + it.text;
      span.title = 'Việc trong Inbox — mở Inbox để chuyển thành thẻ';
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Bỏ ngày';
      del.onclick = async () => { await api('/inbox/' + it.id, { method: 'PATCH', body: { date: '' } }); renderPlanner(); };
      slot.append(span, del);
      cell.appendChild(slot);
    }
    grid.appendChild(cell);
  }
  layout.appendChild(grid);
  root.appendChild(layout);
}
$('plannerBtn').onclick = showPlanner;
