services:
  kanban:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Đặt trong file .env cùng thư mục (script auto-deploy.sh tạo giúp),
      # hoặc sửa trực tiếp 2 giá trị mặc định dưới đây trước lần chạy đầu.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-doi-mat-khau-nay}
      # Trợ lý AI trong thẻ: thêm ANTHROPIC_API_KEY=sk-ant-… vào .env rồi
      # `docker compose up -d` lại. Để trống = nút AI tự ẩn.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
    volumes:
      - kanban-data:/data

volumes:
  kanban-data:
