# Nginx reverse proxy cho task.kairetic.com
# Dùng khi VPS ĐÃ chạy Nginx cho kairetic.com (không cài thêm Caddy để tránh tranh cổng 80/443).
# Đặt file này vào /etc/nginx/sites-available/ rồi symlink sang sites-enabled,
# sau đó chạy certbot để có HTTPS (xem docs/trien-khai-task-kairetic.md).

server {
    listen 80;
    server_name task.kairetic.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (realtime) đi qua đường /ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
