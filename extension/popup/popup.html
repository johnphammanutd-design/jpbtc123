<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Trợ lý phản biện comment</title>
  <style>
    :root { color-scheme: light dark; --accent: #3ea6ff; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px 16px;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }
    .row .value { font-weight: 600; text-align: right; }
    .ok { color: #3fb950; }
    .warn { color: #f85149; }
    .steps {
      margin: 10px 0;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: rgba(62, 166, 255, 0.08);
      border-radius: 0 8px 8px 0;
    }
    .steps ol { margin: 4px 0 0; padding-left: 18px; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px 0;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid rgba(128, 128, 128, 0.5);
      color: inherit;
      margin-top: 6px;
    }
    .disclaimer { margin-top: 10px; font-size: 11px; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>💬 Trợ lý phản biện comment</h1>

  <div class="row"><span>API key</span><span class="value" id="keyStatus">…</span></div>
  <div class="row"><span>Nhà cung cấp</span><span class="value" id="provider">…</span></div>
  <div class="row"><span>Model</span><span class="value" id="model">…</span></div>

  <div class="steps">
    <b>Cách dùng:</b>
    <ol>
      <li>Mở một video YouTube</li>
      <li>Kéo xuống phần bình luận</li>
      <li>Bấm <b>💬 Gợi ý trả lời</b> cạnh comment, hoặc nút nổi <b>🔍 Quét comment trái chiều</b> góc phải dưới</li>
    </ol>
  </div>

  <button id="openOptions">⚙️ Mở cài đặt</button>
  <button id="openYoutube" class="secondary">▶️ Mở YouTube</button>

  <p class="disclaimer">AI chỉ gợi ý — bạn tự sửa và tự đăng. Extension không bao giờ tự đăng comment.</p>

  <script src="popup.js"></script>
</body>
</html>
